  return `<div class="toolbar"><div class="nav-group"><button class="btn-icon" data-a="tkMonth" data-n="-1" aria-label="Mês anterior">${ic('chevL')}</button><button class="btn btn-ghost btn-sm" data-a="tkMonth" data-n="0">Este mês</button><button class="btn-icon" data-a="tkMonth" data-n="1" aria-label="Próximo mês">${ic('chevR')}</button></div><h3>${monthName(d)}</h3></div>
  <div class="card cal-card"><div class="mg"><div class="mg-head">${weekHeader()}</div><div class="mg-grid">${cells.map(c=>{const L=sortTasks(by[c]||[]);return `<div class="mg-cell ${ym(c)!==m?'out':''} ${c===td?'today':''}" data-drop="tdue:${c}" data-a="newTask" data-due="${c}" title="Clique para criar uma tarefa com este prazo"><div class="mg-d"><b>${+c.slice(8)}</b></div>${L.slice(0,4).map(t=>taskChip(t,true)).join('')}${L.length>4?`<span class="more">+${L.length-4} mais</span>`:''}</div>`;}).join('')}</div></div></div>
  ${noDue.length?`<div class="card" style="margin-top:16px"><div class="card-h"><h3>${ic('clock',18)}Tarefas sem prazo</h3><span class="sub">arraste para um dia do calendário para definir o prazo</span></div><div class="row">${noDue.map(t=>`<div style="max-width:260px">${taskChip(t,true)}</div>`).join('')}</div></div>`:''}`;
}
A.tkMonth=el=>{const n=+el.dataset.n;U.tk.month=n===0?today():addMonths(U.tk.month||today(),n);render();};
function taskHistory(){
  const T=U.tk;const td=today();const lim=T.hist==='tudo'?'':addDays(td,-(+T.hist||30));
  const L=filterTasks({ignoreStatus:true}).filter(t=>t.status==='concluida'&&t.completedAt&&(!lim||t.completedAt.slice(0,10)>=lim)).sort((a,b)=>b.completedAt.localeCompare(a.completedAt));
  const by={};L.forEach(t=>{const d=t.completedAt.slice(0,10);(by[d]||(by[d]=[])).push(t);});
  return `<div class="toolbar"><span class="muted small">Período:</span><div class="seg">${[['7','7 dias'],['30','30 dias'],['90','90 dias'],['365','12 meses'],['tudo','Tudo']].map(([k,l])=>`<button class="${T.hist===k?'on':''}" data-a="tkHist" data-v="${k}">${l}</button>`).join('')}</div><span class="muted small">${plural(L.length,'tarefa concluída','tarefas concluídas')}</span></div>
  ${L.length?`<div class="card">${Object.entries(by).map(([d,ts])=>`<div class="hist-day">${relDay(d)==='Hoje'||relDay(d)==='Ontem'?relDay(d)+' · '+fmtD(d):cap(DIAS[wd(d)])+', '+fmtD(d)}</div><div class="tk-list">${ts.map(t=>taskRow(t,{done:true})).join('')}</div>`).join('')}</div>`:`<div class="card empty">${ic('history',30)}<b>Histórico vazio</b>As tarefas concluídas no período aparecerão aqui.</div>`}`;
}
A.tkHist=el=>{U.tk.hist=el.dataset.v;render();};

/* ---------- Ações de tarefa ---------- */
A.taskToggle=el=>{const t=byId(S.tasks,el.dataset.id);if(!t)return;const d=t.status==='concluida';commit(()=>setTaskStatus(t,d?'nao_iniciada':'concluida'),{msg:d?'Tarefa reaberta':'Tarefa concluída'});refreshDayModal();};
CH.taskStatus=el=>{const t=byId(S.tasks,el.dataset.id);if(!t)return;commit(()=>setTaskStatus(t,el.value),{msg:`Status: ${TST[el.value]}`});};
A.taskDup=el=>{const t=byId(S.tasks,el.dataset.id);if(!t)return;dupTask(t);};
function dupTask(t){const c=clone(t);c.id=uid();c.title=t.title+' (cópia)';c.createdAt=stamp();c.status='nao_iniciada';c.completedAt=null;(c.subtasks||[]).forEach(s=>{s.id=uid();s.done=false;});(c.checklist||[]).forEach(s=>{s.id=uid();s.done=false;});commit(s=>s.tasks.push(c),{msg:'Tarefa duplicada'});return c;}
A.taskDel=async el=>{const t=byId(S.tasks,el.dataset.id);if(t)await deleteTask(t);};
async function deleteTask(t){
  if(!(await confirmDlg(`Excluir a tarefa “${esc(t.title)}”? Esta ação não pode ser desfeita.`,{ok:'Excluir',danger:true,title:'Excluir tarefa'})))return false;
  commit(s=>{s.tasks=s.tasks.filter(x=>x.id!==t.id);s.notes.forEach(n=>{if(n.taskId===t.id)n.taskId='';});const p=projOf(t.projectId);if(p)addHist(p,`Tarefa “${t.title}” excluída`);},{msg:'Tarefa excluída'});
  return true;
}
A.newTask=el=>openTaskForm(null,{due:el.dataset.due||'',status:el.dataset.status||'',projectId:el.dataset.project||'',plannedDate:el.dataset.plan||''});
CH.taskRemSel=el=>{const c=el.form.querySelector('[name="reminderCustom"]');c.closest('.inline').hidden=el.value!=='custom';if(el.value==='custom')c.focus();};

function openTaskForm(t=null,def={}){
  const isNew=!t;
  const x=t?clone(t):{id:uid(),title:'',desc:'',createdAt:stamp(),due:def.due||'',dueTime:'',categoryId:def.categoryId||'',priority:'media',status:def.status||'nao_iniciada',assignee:'',
    subtasks:[],checklist:[],links:[],attachments:[],notes:'',projectId:def.projectId||'',plannedDate:def.plannedDate||'',reminder:S.settings.notify.taskDefault??'',completedAt:null};
  const remStd=TASK_REM.map(r=>r[0]);const rv=x.reminder===''||x.reminder==null?'':String(x.reminder);const isCustom=rv!==''&&!remStd.includes(rv);
  const body=`
    ${F.text('title','Título',x.title,{req:true,attr:'autofocus maxlength="200"',ph:'O que precisa ser feito?'})}
    ${F.area('desc','Descrição',x.desc,{rows:2})}
    <div class="grid3">${F.text('due','Prazo',x.due,{type:'date'})}${F.text('dueTime','Horário do prazo',x.dueTime,{type:'time'})}

    <div class="grid3">${F.catSel(x)}${F.sel('priority','Prioridade',F.priOpts(),x.priority)}${F.sel('status','Status',Object.entries(TST),x.status)}</div>

    <div class="fsec">${ic('link',16)}Links</div>${rowsEditor('links',x.links)}
    <div class="fsec">${ic('clip',16)}Anexos</div>${attEditor(x.attachments)}
    <div class="fsec">${ic('note',16)}Observações</div>${F.area('notes','Observações',x.notes,{rows:2})}
    <p class="meta-line"><span>Criada em ${fmtStamp(x.createdAt)}</span>${x.completedAt?`<span>Concluída em ${fmtStamp(x.completedAt)}</span>`:''}</p>`;
  const left=isNew?[]:[
    {l:'Excluir',icon:'trash',cls:'btn-danger-ghost',fn:async()=>{if(await deleteTask(t))Modal.close(true);}},
    {l:'Duplicar',icon:'copy',fn:()=>{Modal.close(true);const c=dupTask(t);openTaskForm(c);}}
  ];
  formModal({title:isNew?'Nova tarefa':'Editar tarefa',size:'lg',body,left,
    onSave:async f=>{
      const d=formData(f);
      if(!d.title)return fieldErr(f,'title','Informe o título da tarefa.');
      if(d.dueTime&&!d.due)return fieldErr(f,'due','Informe a data do prazo para usar um horário.');
      let reminder=d.reminder;
      if(reminder==='custom'){const v=+d.reminderCustom;if(!(v>0))return fieldErr(f,'reminderCustom','Informe a antecedência do lembrete.');reminder=String(v*(+d.reminderUnit||1));}
      if(reminder!==''&&!d.due)return fieldErr(f,'due','Para receber lembrete, informe o prazo da tarefa.');
      const out={...x,title:d.title,desc:d.desc,due:d.due,dueTime:d.dueTime,reminder,categoryId:d.categoryId,categoryOther:isOutros(d.categoryId)?d.categoryOther:'',priority:d.priority,assignee:d.assignee,projectId:d.projectId,plannedDate:d.plannedDate,
        subtasks:readRows(f,'subtasks'),checklist:readRows(f,'checklist'),links:readRows(f,'links'),attachments:readAtt(f),notes:d.notes,updatedAt:stamp()};
      if(isNew&&S.tasks.some(y=>isOpen(y)&&norm(y.title)===norm(out.title)&&(y.due||'')===(out.due||''))){
        if(!(await confirmDlg(`Já existe uma tarefa em aberto chamada “${esc(out.title)}”${out.due?' com o mesmo prazo':''}. Deseja cadastrar mesmo assim?`,{ok:'Cadastrar mesmo assim',title:'Possível duplicidade'})))return false;
      }
      commit(s=>{
        const prevProj=isNew?'':t.projectId;
        if(out.status!==d.status){const tmp=out;tmp.status=x.status;setTaskStatus(tmp,d.status);}
        if(out.projectId!==prevProj){const p=projOf(out.projectId);if(p)addHist(p,`Tarefa “${out.title}” vinculada ao projeto`);const pp=projOf(prevProj);if(pp)addHist(pp,`Tarefa “${out.title}” desvinculada`);}
        if(isNew)s.tasks.push(out);else{const i=s.tasks.findIndex(y=>y.id===out.id);if(i>=0)s.tasks[i]=out;}
      },{msg:isNew?'Tarefa cadastrada':'Tarefa atualizada'});
    }});
}

/* ---------- Campos com salvamento automático (data-bind) ---------- */
function bindSave(el){
  const path=el.dataset.bind.split('|');const v=el.type==='checkbox'?el.checked:el.value;
  commit(s=>{let o=s;for(let i=0;i<path.length-1;i++){const k=path[i];const nk=path[i+1];if(o[k]==null||typeof o[k]!=='object')o[k]=/^\d+$/.test(nk)?[]:{};o=o[k];}o[path[path.length-1]]=v;},{render:false});
}

<script>
'use strict';
/* =====================================================================
   PROJETOS · METAS · ANOTAÇÕES · LISTAS E LEMBRETES
   ===================================================================== */
function filterProjects(){
  const P=U.pj;const q=norm(P.q);
  return S.projects.filter(p=>{
    if(P.status==='ativos'&&!projOpen(p))return false;
    if(PST[P.status]&&p.status!==P.status)return false;
    if(q&&!norm([p.name,p.desc,p.objective,p.owner,catLabel(p.categoryId,p.categoryOther)].join(' ')).includes(q))return false;
    return true;
  }).sort((a,b)=>(projOpen(b)-projOpen(a))||(PRI[b.priority]?.w||0)-(PRI[a.priority]?.w||0)||(a.due||'9999').localeCompare(b.due||'9999'));
}
const dueLabel=(d,open=true)=>{if(!d)return 'sem prazo';const n=diffDays(today(),d);if(!open)return fmtD(d);if(n<0)return `<span class="late-t">atrasado ${plural(-n,'dia')}</span>`;if(n===0)return 'entrega hoje';return `em ${plural(n,'dia')} · ${fmtD(d)}`;};
function projCard(p){
  const s=projStats(p);const c=catOf(p.categoryId);const nx=deadlinesOfProject(p)[0];
  return `<div class="card pj-card" style="--c:${c.color}" data-a="openRef" data-type="project" data-id="${p.id}">
    <div class="row" style="justify-content:space-between"><div class="row">${stPill(p.status)}${priPill(p.priority)}</div>${p.categoryId?catChip(p.categoryId,p.categoryOther):''}</div>
    <h3>${esc(p.name)}</h3>${p.desc||p.objective?`<p>${esc(p.objective||p.desc)}</p>`:''}
    <div class="prog-row">${prog(s.pct)}<b>${s.pct}%</b></div>
    <div class="pj-stats"><span>${ic('flag',12)} Etapas ${s.stagesDone}/${s.stages}</span><span>${ic('tasks',12)} Tarefas ${s.tasksDone}/${s.tasks}</span><span>${ic('clock',12)} ${dueLabel(p.due,projOpen(p))}</span></div>
    ${nx&&projOpen(p)?`<small class="muted">Próximo prazo: <b style="color:var(--heading)">${esc(nx.title)}</b> · ${relDay(nx.date)}</small>`:''}
  </div>`;
}
function deadlinesOfProject(p){
  const L=[];
  for(const s of p.stages||[])if(!s.done&&s.due)L.push({date:s.due,title:s.title,kind:'Etapa'});
  for(const t of S.tasks)if(t.projectId===p.id&&isOpen(t)&&t.due)L.push({date:t.due,title:t.title,kind:'Tarefa',id:t.id});
  if(p.due&&projOpen(p))L.push({date:p.due,title:'Entrega final',kind:'Projeto'});
  return L.sort((a,b)=>a.date.localeCompare(b.date));
}
VIEWS.projetos=()=>{
  if(U.pj.open){const p=projOf(U.pj.open);if(p)return projectDetail(p);U.pj.open=null;}
  const P=U.pj;const L=filterProjects();
  let body='';
  if(!S.projects.length)body=`<div class="card empty">${ic('briefcase',30)}<b>Nenhum projeto cadastrado</b>Organize projetos pessoais e profissionais com etapas, tarefas e prazos.<div style="margin-top:12px"><button class="btn btn-primary btn-sm" data-a="newProject">${ic('plus',15)}Novo projeto</button></div></div>`;
  else if(!L.length&&P.view!=='kanban')body=`<div class="card empty">${ic('search',28)}<b>Nenhum projeto encontrado</b>Ajuste os filtros ou a pesquisa.</div>`;

  else if(P.view==='kanban'){const all=S.projects.filter(p=>!P.q||norm([p.name,p.desc].join(' ')).includes(norm(P.q)));body=`<div class="kb" id="kbProj" data-keep-scroll style="--cols:5">${Object.entries(PST).map(([k,l])=>{const X=all.filter(p=>p.status===k);return `<div class="kb-col" data-drop="pstatus:${k}"><div class="kb-h"><span class="st-dot st-${k}"></span>${l}<em>${X.length}</em></div><div class="kb-list">${X.map(p=>{const s=projStats(p);return `<div class="kb-card" data-drag="proj:${p.id}" data-a="openRef" data-type="project" data-id="${p.id}" style="--c:${catOf(p.categoryId).color}"><div class="kb-top">${priPill(p.priority)}${p.categoryId?catChip(p.categoryId,p.categoryOther):''}</div><b>${esc(p.name)}</b><div class="prog-row">${prog(s.pct)}<b>${s.pct}%</b></div><div class="meta"><span>${ic('clock',12)}${dueLabel(p.due,projOpen(p))}</span></div></div>`;}).join('')||'<div class="kb-empty">Arraste projetos para cá</div>'}</div></div>`;}).join('')}</div>`;}
  else if(P.view==='lista')body=`<div class="card scroll-x" style="padding:6px 10px"><table class="tbl"><thead><tr><th>Projeto</th><th>Categoria</th><th>Responsável</th><th>Início</th><th>Prazo</th><th>Prioridade</th><th>Status</th><th style="width:160px">Progresso</th></tr></thead><tbody>${L.map(p=>{const s=projStats(p);return `<tr data-a="openRef" data-type="project" data-id="${p.id}"><td><b style="color:var(--heading);font-weight:500">${esc(p.name)}</b></td><td>${p.categoryId?catChip(p.categoryId,p.categoryOther):'—'}</td><td>${esc(p.owner||'—')}</td><td>${fmtD(p.start)||'—'}</td><td>${p.due?(projOpen(p)&&p.due<today()?`<span class="late-t">${fmtD(p.due)}</span>`:fmtD(p.due)):'—'}</td><td>${priPill(p.priority)}</td><td>${stPill(p.status)}</td><td><div class="prog-row">${prog(s.pct)}<b>${s.pct}%</b></div></td></tr>`;}).join('')}</tbody></table></div>`;
  else body=projTimeline(L);
  return `<div class="page-h"><div><div class="eyebrow">Gestão</div><h1>Projetos</h1><p class="sub">${plural(S.projects.filter(p=>p.status==='em_andamento').length,'em andamento','em andamento')} · ${plural(S.projects.filter(p=>p.status==='concluido').length,'concluído')}</p></div>
    <div class="ph-actions"><button class="btn btn-primary" data-a="newProject">${ic('plus',16)}Novo projeto</button></div></div>
  <div class="toolbar"><div class="seg">${[['cards','Cards'],['kanban','Kanban'],['lista','Lista'],['linha','Linha do tempo']].map(([k,l])=>`<button class="${P.view===k?'on':''}" data-a="pjView" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="search-in">${ic('search',16)}<input type="search" id="pjQ" placeholder="Pesquisar projetos…" value="${esc(P.q)}" data-in="pjQ" aria-label="Pesquisar projetos"></div>
    ${P.view!=='kanban'?`<select data-ch="pjStatus" aria-label="Status"><option value="ativos" ${P.status==='ativos'?'selected':''}>Ativos</option><option value="todos" ${P.status==='todos'?'selected':''}>Todos</option>${opts(Object.entries(PST),P.status)}</select>`:''}</div>
  ${body}`;
};

function projTimeline(L){
  const X=L.filter(p=>p.start||p.due);const none=L.filter(p=>!p.start&&!p.due);
  if(!X.length)return `<div class="card empty">${ic('timeline',28)}<b>Sem datas para exibir</b>Defina data de início e prazo final nos projetos para vê-los na linha do tempo.</div>`;
  const td=today();
  let a=X.map(p=>p.start||p.due).sort()[0],b=X.map(p=>p.due||p.start).sort().slice(-1)[0];
  if(td<a)a=td;if(td>b)b=td;
  a=monthStart(a);b=monthEnd(b);if(diffDays(a,b)<90)b=monthEnd(addMonths(a,2));
  const span=diffDays(a,b)+1;const months=[];for(let m=a;m<=b;m=addMonths(m,1))months.push(m);
  const pos=d=>diffDays(a,d)/span*100;
  return `<div class="card scroll-x"><div class="tl"><div class="tl-head">${months.map(m=>`<span style="flex:${(diffDays(m,monthEnd(m))+1)}">${MESES_C[+m.slice(5,7)-1]} ${m.slice(2,4)}</span>`).join('')}</div>
    <div style="position:relative">${X.map(p=>{const s=projStats(p);const st=p.start||p.due,en=p.due||p.start;const l=pos(st),w=Math.max(pos(en)+100/span-l,1.2);
      return `<div class="tl-row"><button class="tl-name" data-a="openRef" data-type="project" data-id="${p.id}" title="${esc(p.name)}">${esc(p.name)}</button><div class="tl-track"><div class="tl-bar" style="left:${l}%;width:${w}%;--c:${catOf(p.categoryId).color}" data-a="openRef" data-type="project" data-id="${p.id}" title="${esc(p.name)} · ${fmtD(st)} a ${fmtD(en)} · ${s.pct}%"><i style="--p:${s.pct}%"></i><span>${s.pct}%</span></div></div></div>`;}).join('')}
    <div class="tl-grid" aria-hidden="true">${months.map(m=>`<span style="flex:${(diffDays(m,monthEnd(m))+1)}"></span>`).join('')}</div>
    ${td>=a&&td<=b?`<div style="position:absolute;inset:0 0 0 200px;pointer-events:none"><div class="tl-today" style="left:${pos(td)}%"></div></div>`:''}</div></div></div>
  ${none.length?`<p class="hint" style="margin-top:8px">Sem datas definidas: ${none.map(p=>esc(p.name)).join(', ')}.</p>`:''}`;
}
function projectDetail(p){
  const s=projStats(p);const tasks=sortTasks(S.tasks.filter(t=>t.projectId===p.id));const notes=S.notes.filter(n=>n.projectId===p.id);
  const avail=S.tasks.filter(t=>isOpen(t)&&t.projectId!==p.id);
  const nx=deadlinesOfProject(p).slice(0,8);
  return `<div class="toolbar"><button class="btn btn-ghost btn-sm" data-a="pjBack">${ic('arrowL',15)}Voltar para projetos</button></div>
  <div class="page-h"><div><div class="eyebrow">Projeto</div><h1>${esc(p.name)}</h1><div class="row" style="margin-top:8px">${stPill(p.status)}${priPill(p.priority)}${p.categoryId?catChip(p.categoryId,p.categoryOther):''}</div></div>

      <button class="btn btn-ghost btn-sm" data-a="pjDup" data-id="${p.id}">${ic('copy',15)}Duplicar</button><button class="btn btn-danger-ghost btn-sm" data-a="pjDel" data-id="${p.id}">${ic('trash',15)}Excluir</button><button class="btn btn-primary btn-sm" data-a="pjEdit" data-id="${p.id}">${ic('edit',15)}Editar</button></div></div>
  <div class="grid g-main">
    <div class="stack">
      <section class="card"><div class="row" style="gap:26px;align-items:center">${ring(s.pct,120,'concluído')}<dl class="info-list" style="flex:1;min-width:240px"><dt>Responsável</dt><dd>${esc(p.owner||'—')}</dd><dt>Início</dt><dd>${fmtD(p.start)||'—'}</dd><dt>Prazo final</dt><dd>${p.due?dueLabel(p.due,projOpen(p)):'—'}</dd><dt>Etapas</dt><dd>${s.stagesDone} concluídas · ${s.stages-s.stagesDone} pendentes</dd><dt>Tarefas</dt><dd>${s.tasksDone} de ${s.tasks} concluídas</dd></dl></div>
      <div class="divider"></div><h4 style="margin-bottom:6px">Objetivo</h4><p>${esc(p.objective||'—')}</p>${p.desc?`<h4 style="margin:14px 0 6px">Descrição</h4><p style="white-space:pre-wrap">${esc(p.desc)}</p>`:''}</section>
      <section class="card"><div class="card-h"><h3>${ic('flag',18)}Etapas</h3><span class="sub">${s.stagesDone}/${s.stages}</span></div>
        ${(p.stages||[]).map(st=>`<div class="obj ${st.done?'done':''}"><button class="tick sq ${st.done?'on':''}" data-a="stageToggle" data-p="${p.id}" data-s="${st.id}" aria-label="Concluir etapa">${ic('check',13)}</button><span>${esc(st.title)}${st.done&&st.doneAt?` <small class="muted">· concluída ${fmtStamp(st.doneAt)}</small>`:''}</span>${st.due?`<small class="${!st.done&&st.due<today()?'late-t':'muted'}">${fmtD(st.due)}</small>`:''}<button class="btn-icon sm danger" data-a="stageDel" data-p="${p.id}" data-s="${st.id}" aria-label="Excluir etapa">${ic('x',14)}</button></div>`).join('')||'<p class="muted small">Nenhuma etapa cadastrada.</p>'}
        <div class="add-line" style="margin-top:10px"><input type="text" placeholder="Nova etapa — pressione Enter" data-enter="stageAdd" data-p="${p.id}" aria-label="Nova etapa"></div></section>
      <section class="card"><div class="card-h"><h3>${ic('tasks',18)}Tarefas vinculadas</h3><div class="row"><button class="btn btn-ghost btn-sm" data-a="newTask" data-project="${p.id}">${ic('plus',14)}Nova tarefa</button></div></div>
        ${tasks.length?taskListHTML(tasks):'<p class="muted small">Nenhuma tarefa vinculada.</p>'}
        ${avail.length?`<div class="row" style="margin-top:12px"><select data-ch="pjLinkTask" data-p="${p.id}" style="max-width:420px" aria-label="Vincular tarefa existente"><option value="">Vincular tarefa existente…</option>${opts(avail.map(t=>[t.id,t.title]),'')}</select></div>`:''}</section>
    </div>
    <div class="stack">
      <section class="card"><div class="card-h"><h3>${ic('clock',18)}Próximos prazos</h3></div>${nx.length?`<div class="mini-list">${nx.map(x=>`<div class="mini-it"><span class="d ${x.date<today()?'late-t':''}">${fmtD(x.date)}</span><b>${esc(x.title)}</b><small class="muted">${x.kind}</small></div>`).join('')}</div>`:'<div class="empty sm">Nenhum prazo pendente.</div>'}</section>
      <section class="card"><div class="card-h"><h3>${ic('history',18)}Histórico de atualizações</h3></div>
        <div class="add-line" style="margin-bottom:10px"><input type="text" placeholder="Registrar atualização — pressione Enter" data-enter="pjHist" data-p="${p.id}" aria-label="Registrar atualização"></div>
        <div class="hist">${(p.history||[]).map(h=>`<div class="hist-it"><time>${fmtStamp(h.at)}</time><span>${esc(h.text)}</span></div>`).join('')||'<p class="muted small">Sem registros.</p>'}</div></section>
      <section class="card"><div class="card-h"><h3>${ic('clip',18)}Anexos e observações</h3></div>${attView(p.attachments)}${p.notes?`<div class="divider"></div><p style="white-space:pre-wrap">${esc(p.notes)}</p>`:''}</section>
      ${notes.length?`<section class="card"><div class="card-h"><h3>${ic('note',18)}Anotações vinculadas</h3></div>${notes.map(n=>`<button class="mini-it" data-a="openRef" data-type="note" data-id="${n.id}"><b>${esc(n.title||'(sem título)')}</b><small class="muted">${fmtD((n.updatedAt||n.createdAt||'').slice(0,10))}</small></button>`).join('')}</section>`:''}
    </div>
  </div>`;
}

    <div class="grid3">${F.catSel(x)}${F.sel('priority','Prioridade',F.priOpts(),x.priority)}${F.sel('status','Status',Object.entries(PST),x.status)}</div>
    <div class="grid3">${F.text('start','Data de início',x.start,{type:'date'})}${F.text('due','Prazo final',x.due,{type:'date'})}${F.text('owner','Responsável',x.owner)}</div>
    <div class="fsec">${ic('flag',16)}Etapas</div><p class="hint" style="margin-top:-8px">O percentual de conclusão é calculado automaticamente a partir das etapas e das tarefas vinculadas.</p>${rowsEditor('stages',x.stages)}
    <div class="fsec">${ic('clip',16)}Anexos</div>${attEditor(x.attachments)}
    <div class="fsec">${ic('note',16)}Observações</div>${F.area('notes','Observações',x.notes,{rows:2})}`;
  formModal({title:isNew?'Novo projeto':'Editar projeto',size:'lg',body,
    onSave:async f=>{
      const d=formData(f);
      if(!d.name)return fieldErr(f,'name','Informe o nome do projeto.');
      if(d.start&&d.due&&d.due<d.start)return fieldErr(f,'due','O prazo final deve ser depois da data de início.');
      if(isNew&&S.projects.some(y=>norm(y.name)===norm(d.name)&&projOpen(y))&&!(await confirmDlg(`Já existe um projeto ativo chamado “${esc(d.name)}”. Deseja cadastrar mesmo assim?`,{ok:'Cadastrar mesmo assim',title:'Possível duplicidade'})))return false;
      const stages=readRows(f,'stages');
      const out={...x,name:d.name,objective:d.objective,desc:d.desc,categoryId:d.categoryId,categoryOther:isOutros(d.categoryId)?d.categoryOther:'',priority:d.priority,status:d.status,start:d.start,due:d.due,owner:d.owner,stages,attachments:readAtt(f),notes:d.notes,updatedAt:stamp()};
      commit(s=>{
        if(isNew){out.history=[{at:stamp(),text:'Projeto criado'}];s.projects.push(out);}
        else{
          if(p.status!==out.status)addHist(out,`Status alterado de ${PST[p.status]} para ${PST[out.status]}`);
          const before=new Map((p.stages||[]).map(st=>[st.id,st]));
          stages.forEach(st=>{const b=before.get(st.id);if(!b)addHist(out,`Etapa “${st.title}” adicionada`);else if(b.done!==st.done)addHist(out,`Etapa “${st.title}” ${st.done?'concluída':'reaberta'}`);});
          (p.stages||[]).forEach(b=>{if(!stages.some(st=>st.id===b.id))addHist(out,`Etapa “${b.title}” excluída`);});
          if(p.due!==out.due)addHist(out,`Prazo final alterado para ${fmtD(out.due)||'sem prazo'}`);
          const i=s.projects.findIndex(y=>y.id===out.id);if(i>=0)s.projects[i]=out;
        }
      },{msg:isNew?'Projeto cadastrado':'Projeto atualizado'});
      if(isNew){U.pj.open=out.id;if(U.route!=='projetos')go('projetos');else render();}
    }});
}

VIEWS.metas=()=>{

  const L=S.goals.filter(g=>(!G.period||g.period===G.period)&&(G.status==='todas'||(G.status==='andamento'?goalOpen(g):!goalOpen(g)))&&(!q||norm([g.name,g.desc,g.unit].join(' ')).includes(q)))

  const open=S.goals.filter(goalOpen);const avg=open.length?Math.round(open.reduce((s,g)=>s+goalPct(g),0)/open.length):0;

  <div class="toolbar"><div class="seg">${[['','Todas'],...Object.entries(GPER).map(([k,v])=>[k,v+'s'])].map(([k,l])=>`<button class="${G.period===k?'on':''}" data-a="glPer" data-v="${k}">${l}</button>`).join('')}</div>
    <select data-ch="glStatus" aria-label="Situação"><option value="andamento" ${G.status==='andamento'?'selected':''}>Em andamento</option><option value="concluidas" ${G.status==='concluidas'?'selected':''}>Alcançadas</option><option value="todas" ${G.status==='todas'?'selected':''}>Todas</option></select>
    <div class="search-in">${ic('search',16)}<input type="search" id="glQ" placeholder="Pesquisar metas…" value="${esc(G.q)}" data-in="glQ" aria-label="Pesquisar metas"></div></div>
  ${L.length?`<div class="gl-grid">${L.map(goalCard).join('')}</div>`:`<div class="card empty">${ic('target',30)}<b>${S.goals.length?'Nenhuma meta encontrada':'Nenhuma meta cadastrada'}</b>${S.goals.length?'Ajuste os filtros.':'Defina metas diárias, semanais, mensais ou anuais e acompanhe a evolução.'}<div style="margin-top:12px"><button class="btn btn-primary btn-sm" data-a="newGoal">${ic('plus',15)}Nova meta</button></div></div>`}`;

function goalCard(g){
  const p=goalPct(g);const vals=(g.history||[]).map(h=>+h.value);
  return `<div class="card gl-card ${p>=100?'done':''}" data-a="openRef" data-type="goal" data-id="${g.id}">
    <div class="gl-top"><div style="min-width:0"><div class="row" style="margin-bottom:6px"><span class="badge-gold">${GPER[g.period]||'Meta'}</span>${g.categoryId?catChip(g.categoryId,g.categoryOther):''}</div><h3>${esc(g.name)}</h3></div><div class="gl-pct">${p}%</div></div>
    ${prog(p,p>=100?'ok':'gold')}
    <div class="gl-vals">Atual <b>${fmtNum(g.current)}</b> de <b>${fmtNum(g.target)}</b> ${esc(g.unit||'')}${+g.initial?` · início em ${fmtNum(g.initial)}`:''}</div>
    ${spark(vals)}
    <div class="row" style="justify-content:space-between"><small class="muted">${ic('clock',12).replace('class="i"','class="i" style="display:inline;vertical-align:-2px"')} ${g.due?(goalOpen(g)&&g.due<today()?'<span class="late-t">prazo encerrado</span>':'prazo '+fmtD(g.due)):'sem prazo'}</small><button class="btn btn-gold btn-sm" data-a="goalUpdate" data-id="${g.id}">${ic('trend',14)}Registrar atualização</button></div>

}

function goalUpdateDlg(g,after){
  formModal({title:'Registrar atualização',size:'sm',saveLabel:'Registrar',
    body:`<p class="muted">${esc(g.name)} — atual: <b>${fmtNum(g.current)}</b> de ${fmtNum(g.target)} ${esc(g.unit||'')}</p>
      <div class="grid2">${F.text('value','Novo resultado atual',g.current,{type:'number',req:true,attr:'step="any" autofocus'})}${F.text('date','Data',today(),{type:'date'})}</div>${F.text('note','Observação',' '.trim(),{ph:'Opcional'})}`,
    onSave:f=>{
      const d=formData(f);if(d.value===''||!isFinite(+d.value))return fieldErr(f,'value','Informe um valor numérico.');
      const was=goalPct(g);
      commit(()=>{(g.history||(g.history=[])).push({at:(d.date||today())+'T'+stamp().slice(11),value:+d.value,note:d.note});g.history.sort((a,b)=>a.at.localeCompare(b.at));g.current=+g.history[g.history.length-1].value;},{msg:'Atualização registrada'});

    }});

    foot:`<div class="mf-left"><button class="btn btn-danger-ghost btn-sm" data-gd="del">${ic('trash',15)}Excluir</button><button class="btn btn-ghost btn-sm" data-gd="edit">${ic('edit',15)}Editar</button></div><div class="mf-right"><button class="btn btn-primary" data-gd="upd">${ic('trend',16)}Registrar atualização</button></div>`});
  const reopen=()=>{const ng=byId(S.goals,g.id);if(ng)openGoalDetail(ng);};
  $('[data-gd="upd"]',el).onclick=()=>{Modal.close();goalUpdateDlg(g,reopen);};
  $('[data-gd="edit"]',el).onclick=()=>{Modal.close();openGoalForm(g);};

  $$('[data-gh]',el).forEach(b=>b.onclick=async()=>{const [at,v]=b.dataset.gh.split('|');if(!(await confirmDlg('Excluir este registro do histórico?',{ok:'Excluir',danger:true})))return;Modal.close();commit(()=>{const i=g.history.findIndex(h=>h.at===at&&String(h.value)===v);if(i>=0)g.history.splice(i,1);if(g.history.length)g.current=+g.history[g.history.length-1].value;},{msg:'Registro excluído'});reopen();});

function openGoalForm(g=null,def={}){
  const isNew=!g;
  const x=g?clone(g):{id:uid(),name:'',desc:'',categoryId:'',period:def.period||'mensal',start:def.start||today(),due:def.due||'',target:'',current:0,initial:0,unit:'',history:[],createdAt:stamp()};
  const body=`${F.text('name','Nome da meta',x.name,{req:true,attr:'autofocus maxlength="160"',ph:'Ex.: Ler 12 livros no ano'})}

    <div class="grid3">${F.sel('period','Periodicidade',Object.entries(GPER),x.period)}${F.catSel(x)}${F.text('unit','Indicador (unidade)',x.unit,{ph:'Ex.: livros, %, km, R$'})}</div>
    <div class="grid2">${F.text('start','Data de início',x.start,{type:'date'})}${F.text('due','Prazo',x.due,{type:'date'})}</div>
    <div class="grid3">${F.text('initial','Valor inicial',x.initial,{type:'number',attr:'step="any"'})}${F.text('target','Resultado esperado',x.target,{type:'number',req:true,attr:'step="any"'})}${F.text('current','Resultado atual',x.current,{type:'number',attr:'step="any"'})}</div>
    <p class="hint">Percentual = (atual − inicial) ÷ (esperado − inicial). Funciona também para metas de redução (ex.: de 80 kg para 72 kg).</p>`;
  formModal({title:isNew?'Nova meta':'Editar meta',size:'lg',body,
    onSave:async f=>{
      const d=formData(f);
      if(!d.name)return fieldErr(f,'name','Informe o nome da meta.');
      if(d.target===''||!isFinite(+d.target))return fieldErr(f,'target','Informe o resultado esperado (número).');
      if(+d.target===+(d.initial||0))return fieldErr(f,'target','O resultado esperado deve ser diferente do valor inicial.');
      if(d.start&&d.due&&d.due<d.start)return fieldErr(f,'due','O prazo deve ser depois da data de início.');
      if(isNew&&S.goals.some(y=>norm(y.name)===norm(d.name)&&goalOpen(y))&&!(await confirmDlg(`Já existe uma meta ativa chamada “${esc(d.name)}”. Deseja cadastrar mesmo assim?`,{ok:'Cadastrar mesmo assim',title:'Possível duplicidade'})))return false;
      const cur=d.current===''?0:+d.current;
      const out={...x,name:d.name,desc:d.desc,period:d.period,categoryId:d.categoryId,categoryOther:isOutros(d.categoryId)?d.categoryOther:'',unit:d.unit,start:d.start,due:d.due,initial:+(d.initial||0),target:+d.target,current:cur,updatedAt:stamp()};
      if(isNew||+x.current!==cur)(out.history||(out.history=[])).push({at:stamp(),value:cur,note:isNew?'Valor inicial registrado':'Ajuste manual'});
      commit(s=>{if(isNew)s.goals.push(out);else{const i=s.goals.findIndex(y=>y.id===out.id);if(i>=0)s.goals[i]=out;}},{msg:isNew?'Meta cadastrada':'Meta atualizada'});
    }});
}

  const sel=byId(S.lists,U.ls.sel);const names=new Set(S.lists.map(l=>norm(l.name)));

  const td=today();const rems=[...S.reminders].sort((a,b)=>(a.done-b.done)||(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const totalPend=S.lists.reduce((s,l)=>s+(l.items||[]).filter(i=>!i.done).length,0);
  return `<div class="page-h"><div><div class="eyebrow">Organização</div><h1>Listas e Pendências</h1><p class="sub">${plural(S.lists.length,'lista')} · ${plural(totalPend,'item pendente','itens pendentes')} · ${plural(S.reminders.filter(r=>!r.done).length,'lembrete ativo','lembretes ativos')}</p></div>
    <div class="ph-actions"><button class="btn btn-ghost" data-a="newReminder">${ic('bell',16)}Novo lembrete</button><button class="btn btn-primary" data-a="newList">${ic('plus',16)}Nova lista</button></div></div>
  <div class="ls-layout">
    <div class="stack">
      <section class="card" style="padding:12px"><div class="card-h" style="padding:6px 6px 0"><h3>${ic('bag',18)}Minhas listas</h3></div>
        ${S.lists.map(l=>{const it=l.items||[];const p=it.filter(i=>!i.done).length;return `<button class="ls-item ${l.id===U.ls.sel?'on':''}" data-a="listSel" data-id="${l.id}"><span class="ls-ic">${ic('list',17)}</span><span class="t"><b>${esc(l.name)}</b><small>${p} pendente(s) · ${it.length} no total</small></span></button>`;}).join('')||'<p class="muted small" style="padding:8px">Nenhuma lista criada.</p>'}
        ${tpl.length?`<div class="divider"></div><p class="small muted" style="padding:0 6px 6px">Criar a partir de modelo:</p><div class="tpl" style="padding:0 6px 6px">${tpl.map(t=>`<button data-a="listTpl" data-n="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>`:''}</section>
      <section class="card"><div class="card-h"><h3>${ic('bell',18)}Lembretes</h3><button class="link" data-a="newReminder">+ Novo</button></div>
        ${rems.length?rems.map(r=>`<div class="obj ${r.done?'done':''}"><button class="tick ${r.done?'on':''}" data-a="remToggle" data-id="${r.id}" aria-label="Concluir lembrete">${ic('check',13)}</button><span><button class="link" style="color:var(--heading);font-size:13.5px" data-a="openRef" data-type="reminder" data-id="${r.id}">${esc(r.title)}</button><br><small class="${!r.done&&(r.date<td||(r.date===td&&r.time&&toMin(r.time)<nowMin()))?'late-t':'muted'}">${relDay(r.date)}${r.time?' às '+r.time:''}</small></span></div>`).join(''):'<div class="empty sm">Nenhum lembrete. Lembretes geram notificações na data e hora definidas.</div>'}</section>
    </div>
    <section class="card">${sel?listDetail(sel):`<div class="empty">${ic('bag',32)}<b>Crie a sua primeira lista</b>Compras, coisas para resolver, livros, cursos… Use um modelo ao lado ou crie uma lista personalizada.<div style="margin-top:12px"><button class="btn btn-primary btn-sm" data-a="newList">${ic('plus',15)}Nova lista</button></div></div>`}</section>
  </div>`;
};
function listDetail(l){
  const it=l.items||[];const pend=it.filter(i=>!i.done),done=it.filter(i=>i.done);
  const row=i=>`<div class="li-row ${i.done?'done':''}"><button class="tick ${i.done?'on':''}" data-a="itemToggle" data-l="${l.id}" data-id="${i.id}" aria-label="${i.done?'Desmarcar':'Marcar como concluído'}">${ic('check',13)}</button><input type="text" value="${esc(i.text)}" data-ch="itemEdit" data-l="${l.id}" data-id="${i.id}" aria-label="Item"><button class="btn-icon sm danger" data-a="itemDel" data-l="${l.id}" data-id="${i.id}" aria-label="Excluir item">${ic('x',14)}</button></div>`;
  return `<div class="card-h"><div><h2>${esc(l.name)}</h2><div class="row" style="margin-top:6px"><span style="width:180px">${prog(pctOf(done.length,it.length),'gold')}</span><small class="muted">${done.length} de ${it.length} concluídos</small></div></div>
    <div class="row"><button class="btn btn-ghost btn-sm" data-a="listRename" data-id="${l.id}">${ic('edit',14)}Renomear</button><button class="btn btn-danger-ghost btn-sm" data-a="listDel" data-id="${l.id}">${ic('trash',14)}Excluir lista</button></div></div>
  <div class="add-line" style="margin-bottom:12px"><input type="text" id="itemNew" placeholder="Adicionar item — pressione Enter" data-enter="itemAdd" data-l="${l.id}" aria-label="Novo item"><button class="btn btn-primary" data-a="itemAddBtn" data-l="${l.id}">${ic('plus',15)}Adicionar</button></div>
  ${pend.length?pend.map(row).join(''):`<div class="empty sm">${it.length?'Tudo concluído nesta lista! ✨':'Lista vazia. Adicione o primeiro item acima.'}</div>`}
  ${done.length?`<div class="row" style="justify-content:space-between;margin:16px 0 6px"><button class="link" data-a="lsShowDone">${U.ls.showDone?'Ocultar':'Mostrar'} concluídos (${done.length})</button><button class="link" data-a="listClear" data-id="${l.id}">Limpar concluídos</button></div>${U.ls.showDone?done.map(row).join(''):''}`:''}`;
}
A.listSel=el=>{U.ls.sel=el.dataset.id;render();};
A.lsShowDone=()=>{U.ls.showDone=!U.ls.showDone;render();};
A.newList=()=>formModal({title:'Nova lista',size:'sm',body:F.text('name','Nome da lista','',{req:true,attr:'autofocus maxlength="80"',ph:'Ex.: Presentes de Natal'}),saveLabel:'Criar lista',
  onSave:f=>{const n=f.name.value.trim();if(!n)return fieldErr(f,'name','Informe o nome da lista.');if(S.lists.some(l=>norm(l.name)===norm(n)))return fieldErr(f,'name','Já existe uma lista com esse nome.');const id=uid();commit(s=>s.lists.push({id,name:n,items:[],createdAt:stamp()}),{msg:'Lista criada'});U.ls.sel=id;if(U.route!=='listas')go('listas');else render();}});
A.listTpl=el=>{const id=uid();commit(s=>s.lists.push({id,name:el.dataset.n,items:[],createdAt:stamp()}),{msg:`Lista “${el.dataset.n}” criada`});U.ls.sel=id;render();setTimeout(()=>{const i=$('#itemNew');i&&i.focus();},50);};
A.listRename=el=>{const l=byId(S.lists,el.dataset.id);formModal({title:'Renomear lista',size:'sm',body:F.text('name','Nome da lista',l.name,{req:true,attr:'autofocus maxlength="80"'}),
  onSave:f=>{const n=f.name.value.trim();if(!n)return fieldErr(f,'name','Informe o nome da lista.');if(S.lists.some(x=>x.id!==l.id&&norm(x.name)===norm(n)))return fieldErr(f,'name','Já existe uma lista com esse nome.');commit(()=>{l.name=n;},{msg:'Lista renomeada'});}});};
A.listDel=async el=>{const l=byId(S.lists,el.dataset.id);if(!(await confirmDlg(`Excluir a lista “${esc(l.name)}” e seus ${plural((l.items||[]).length,'item','itens')}? Esta ação não pode ser desfeita.`,{ok:'Excluir lista',danger:true,title:'Excluir lista'})))return;commit(s=>{s.lists=s.lists.filter(x=>x.id!==l.id);},{msg:'Lista excluída'});U.ls.sel=null;render();};
A.listClear=async el=>{const l=byId(S.lists,el.dataset.id);const n=(l.items||[]).filter(i=>i.done).length;if(!(await confirmDlg(`Remover ${plural(n,'item concluído','itens concluídos')} da lista?`,{ok:'Remover',danger:true})))return;commit(()=>{l.items=l.items.filter(i=>!i.done);},{msg:'Itens concluídos removidos'});};
function addItem(lid,input){const v=input.value.trim();if(!v){input.focus();return;}const l=byId(S.lists,lid);if((l.items||[]).some(i=>!i.done&&norm(i.text)===norm(v))){toast('Este item já está na lista.','warn');input.select();return;}commit(()=>{(l.items||(l.items=[])).push({id:uid(),text:v,done:false,createdAt:stamp()});});const i=$('#itemNew');if(i)i.focus();}
EN.itemAdd=el=>addItem(el.dataset.l,el);
A.itemAddBtn=el=>addItem(el.dataset.l,$('#itemNew'));
A.itemToggle=el=>{const l=byId(S.lists,el.dataset.l);const i=(l.items||[]).find(x=>x.id===el.dataset.id);if(!i)return;commit(()=>{i.done=!i.done;i.doneAt=i.done?stamp():'';});};
A.itemDel=el=>{const l=byId(S.lists,el.dataset.l);const i=(l.items||[]).find(x=>x.id===el.dataset.id);if(!i)return;commit(()=>{l.items=l.items.filter(x=>x.id!==i.id);},{msg:'Item removido'});};
CH.itemEdit=el=>{const l=byId(S.lists,el.dataset.l);const i=(l.items||[]).find(x=>x.id===el.dataset.id);if(!i)return;const v=el.value.trim();if(!v){el.value=i.text;toast('O item não pode ficar vazio.','error');return;}commit(()=>{i.text=v;},{render:false});};

/* ---------- Lembretes avulsos ---------- */
A.newReminder=()=>openReminderForm();

function openReminderForm(r=null){
  const isNew=!r;const x=r?clone(r):{id:uid(),title:'',date:today(),time:'',notes:'',done:false,createdAt:stamp()};
  const left=isNew?[]:[{l:'Excluir',icon:'trash',cls:'btn-danger-ghost',fn:async()=>{if(!(await confirmDlg(`Excluir o lembrete “${esc(x.title)}”?`,{ok:'Excluir',danger:true})))return;Modal.close(true);commit(s=>{s.reminders=s.reminders.filter(y=>y.id!==x.id);},{msg:'Lembrete excluído'});}},
    {l:x.done?'Reabrir':'Concluir',icon:'check',fn:()=>{Modal.close(true);commit(()=>{const y=byId(S.reminders,x.id);y.done=!y.done;},{msg:x.done?'Lembrete reaberto':'Lembrete concluído'});}}];
  formModal({title:isNew?'Novo lembrete':'Editar lembrete',size:'sm',left,
    body:`${F.text('title','Lembrar de',x.title,{req:true,attr:'autofocus maxlength="160"'})}<div class="grid2">${F.text('date','Data',x.date,{type:'date',req:true})}${F.text('time','Horário',x.time,{type:'time'})}</div>${F.area('notes','Observações',x.notes,{rows:2})}<p class="hint">Você receberá uma notificação na data e no horário definidos (sem horário: às 08:00).</p>`,
    onSave:f=>{const d=formData(f);if(!d.title)return fieldErr(f,'title','Descreva o lembrete.');if(!isDate(d.date))return fieldErr(f,'date','Informe a data do lembrete.');
      const out={...x,title:d.title,date:d.date,time:d.time,notes:d.notes,updatedAt:stamp()};
      commit(s=>{if(isNew)s.reminders.push(out);else{const i=s.reminders.findIndex(y=>y.id===out.id);if(i>=0)s.reminders[i]=out;}},{msg:isNew?'Lembrete criado':'Lembrete atualizado'});}});
}

<script>
'use strict';
/* =====================================================================
   CALENDÁRIO MENSTRUAL
   ===================================================================== */
U.cy={year:''};
const cyDur=p=>Math.max(1,+(p&&p.days)||+S.cycle.duration||5);
function cycStats(){
  const P=[...S.cycle.periods].sort((a,b)=>a.start.localeCompare(b.start));
  const gaps=[];for(let i=1;i<P.length;i++){const g=diffDays(P[i-1].start,P[i].start);if(g>=15&&g<=60)gaps.push(g);}
  const recent=gaps.slice(-6);
  const avg=recent.length?Math.round(recent.reduce((s,x)=>s+x,0)/recent.length):(+S.cycle.cycleLen||28);
  return {P,avg,last:P[P.length-1]||null,gaps:recent};
}
function cycMap(y){
  const {P,avg,last}=cycStats();const m={};
  for(const p of P)for(let i=0;i<cyDur(p);i++)m[addDays(p.start,i)]={k:'per',start:p.start};
  if(last){
    const lim=`${+y+1}-01-31`;
    for(let k=1;k<=40;k++){
      const s=addDays(last.start,avg*k);if(addDays(s,-20)>lim)break;
      const ov=addDays(s,-14);
      for(let i=-5;i<=1;i++){const d=addDays(ov,i);if(!m[d])m[d]={k:i===0?'ovu':'fer'};}
      for(let i=0;i<(+S.cycle.duration||5);i++){const d=addDays(s,i);if(!m[d])m[d]={k:'pred'};}
    }
  }
  return m;
}
const CY_LBL={per:'Menstruação registrada',pred:'Menstruação prevista',fer:'Período fértil estimado',ovu:'Ovulação estimada'};
VIEWS.ciclo=()=>{
  const td=today();if(!U.cy.year)U.cy.year=td.slice(0,4);const y=U.cy.year;
  const m=cycMap(y);const {avg,last,P,gaps}=cycStats();
  let next=last?addDays(last.start,avg):null;while(next&&addDays(next,+S.cycle.duration||5)<=td)next=addDays(next,avg);
  const inPer=m[td]&&m[td].k==='per';
  const dayN=last?diffDays(last.start,td)+1:null;
  const cell=(mi,d)=>{
    const ds=`${y}-${pad(mi+1)}-${pad(d)}`;
    if(d>new Date(+y,mi+1,0).getDate())return '<td class="cy-x"></td>';
    const c=m[ds];const tip=`${fmtD(ds)}${c?' — '+CY_LBL[c.k]:''}`;
    return `<td><button class="cy-d ${c?'cy-'+c.k:''} ${ds===td?'today':''} ${ds>td?'fut':''}" data-a="cyClick" data-d="${ds}" title="${tip}" aria-label="${tip}"></button></td>`;
  };
  return `<div class="page-h"><div><div class="eyebrow">Saúde</div><h1>Calendário Menstrual</h1><p class="sub">Clique no 1º dia da menstruação — os dias seguintes e as próximas datas são calculados automaticamente.</p></div>
    <div class="ph-actions"><div class="nav-group"><button class="btn-icon" data-a="cyYear" data-n="-1" aria-label="Ano anterior">${ic('chevL')}</button><b style="font-family:var(--ff-title);font-size:24px;color:var(--heading);min-width:64px;text-align:center">${y}</b><button class="btn-icon" data-a="cyYear" data-n="1" aria-label="Próximo ano">${ic('chevR')}</button></div><button class="btn btn-primary" data-a="cyToday">${ic('drop',16)}Menstruei hoje</button></div></div>
  <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    <div class="kpi" style="cursor:default"><span class="k-ic">${ic('drop',18)}</span><b>${last?fmtDS(last.start):'—'}</b><span>Última menstruação</span><small>${last?(inPer?`em andamento · ${dayN}º dia`:`${relDay(last.start)==='Hoje'?'hoje':'há '+plural(diffDays(last.start,td),'dia')}`):'nenhum registro ainda'}</small></div>
    <div class="kpi" style="cursor:default"><span class="k-ic">${ic('calendar',18)}</span><b>${next?fmtDS(next):'—'}</b><span>Próxima prevista</span><small>${next?(next<=td?'pode começar a qualquer momento':`em ${plural(diffDays(td,next),'dia')}`):'registre a última menstruação'}</small></div>
    <div class="kpi gold" style="cursor:default"><span class="k-ic">${ic('repeat',18)}</span><b>${avg}</b><span>Ciclo médio (dias)</span><small>${gaps.length?`média de ${plural(gaps.length,'ciclo')} registrado(s)`:'valor padrão — ajuste abaixo'}</small></div>
    <div class="kpi gold" style="cursor:default"><span class="k-ic">${ic('clock',18)}</span><b>${last&&!inPer&&dayN?dayN:inPer?dayN:'—'}</b><span>Dia do ciclo</span><small>${last?'contando desde o último início':'—'}</small></div>
  </div>
  <section class="card cy-card">
    <div class="cy-title">${ic('sparkle',18)}<h2>Calendário Menstrual ${y}</h2>${ic('sparkle',18)}</div>
    <div class="scroll-x"><table class="cy"><thead><tr><th></th>${Array.from({length:31},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead>
      <tbody>${MESES.map((mn,mi)=>`<tr><th>${mn.toUpperCase()}</th>${Array.from({length:31},(_,i)=>cell(mi,i+1)).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="legend" style="margin-top:12px"><span><i class="cy-sw cy-per"></i>Menstruação</span><span><i class="cy-sw cy-pred"></i>Prevista</span><span><i class="cy-sw cy-fer"></i>Período fértil (estimado)</span><span><i class="cy-sw cy-ovu"></i>Ovulação (estimada)</span><span><i class="cy-sw" style="box-shadow:0 0 0 2px var(--heading)"></i>Hoje</span></div>
    <p class="hint" style="margin-top:8px">Clique em um dia marcado para remover aquele registro. As previsões são estimativas baseadas nos seus registros e não substituem orientação médica.</p>
  </section>
  <div class="grid g2" style="margin-top:18px">
    <section class="card"><div class="card-h"><h3>${ic('settings',18)}Ajustes</h3></div>
      <div class="set-row"><div><b>Duração da menstruação</b><small>Dias marcados a cada novo registro</small></div><span class="inline"><input type="number" min="1" max="15" class="w70" value="${+S.cycle.duration||5}" data-ch="cySet" data-k="duration" aria-label="Duração em dias"><small class="hint">dias</small></span></div>
      <div class="set-row"><div><b>Ciclo padrão</b><small>Usado até haver 2 registros; depois a média é calculada automaticamente</small></div><span class="inline"><input type="number" min="15" max="60" class="w70" value="${+S.cycle.cycleLen||28}" data-ch="cySet" data-k="cycleLen" aria-label="Ciclo padrão em dias"><small class="hint">dias</small></span></div></section>
    <section class="card"><div class="card-h"><h3>${ic('history',18)}Histórico</h3><span class="sub">${plural(P.length,'registro')}</span></div>
      ${P.length?`<table class="tbl static"><thead><tr><th>Início</th><th>Duração</th><th>Ciclo</th><th></th></tr></thead><tbody>${[...P].reverse().map((p,i,arr)=>{const prev=arr[i+1];return `<tr><td>${fmtD(p.start)}</td><td><span class="inline"><input type="number" min="1" max="15" class="w70" value="${cyDur(p)}" data-ch="cyPDays" data-s="${p.start}" aria-label="Duração"><small class="hint">dias</small></span></td><td>${prev?plural(diffDays(prev.start,p.start),'dia'):'—'}</td><td style="text-align:right"><button class="btn-icon sm danger" data-a="cyDel" data-s="${p.start}" aria-label="Excluir registro">${ic('trash',14)}</button></td></tr>`;}).join('')}</tbody></table>`:'<div class="empty sm">Nenhum registro. Clique no dia da última menstruação no calendário acima.</div>'}</section>
  </div>`;
};
A.cyYear=el=>{U.cy.year=String(+U.cy.year+(+el.dataset.n));render();};
function cyFind(d){return S.cycle.periods.find(p=>d>=p.start&&d<addDays(p.start,cyDur(p)));}
A.cyClick=el=>{
  const d=el.dataset.d;const p=cyFind(d);
  if(p){commit(s=>{s.cycle.periods=s.cycle.periods.filter(x=>x!==p);},{msg:`Registro de ${fmtD(p.start)} removido`});return;}
  if(d>today()){toast('Não é possível registrar uma data futura.','warn');return;}
  commit(s=>{s.cycle.periods.push({start:d,days:+s.cycle.duration||5});s.cycle.periods.sort((a,b)=>a.start.localeCompare(b.start));},{msg:`Menstruação registrada em ${fmtD(d)}`});
};
A.cyToday=()=>{const td=today();U.cy.year=td.slice(0,4);if(cyFind(td)){toast('Hoje já está marcado como menstruação.','warn');render();return;}A.cyClick({dataset:{d:td}});};
A.cyDel=async el=>{const p=S.cycle.periods.find(x=>x.start===el.dataset.s);if(!p)return;if(!(await confirmDlg(`Excluir o registro de ${fmtD(p.start)}?`,{ok:'Excluir',danger:true})))return;commit(s=>{s.cycle.periods=s.cycle.periods.filter(x=>x!==p);},{msg:'Registro excluído'});};
CH.cyPDays=el=>{const p=S.cycle.periods.find(x=>x.start===el.dataset.s);if(!p)return;const v=clamp(parseInt(el.value)||1,1,15);commit(()=>{p.days=v;},{msg:'Duração atualizada'});};
CH.cySet=el=>{const k=el.dataset.k;const v=k==='duration'?clamp(parseInt(el.value)||5,1,15):clamp(parseInt(el.value)||28,15,60);commit(s=>{s.cycle[k]=v;},{msg:'Ajuste salvo'});};
</script>
<script>
'use strict';
/* =====================================================================
   CONTROLE FINANCEIRO — salário (receitas) e contas (despesas)
   ===================================================================== */
U.fn={ym:'',tab:'todas'};
const FIN_CATS={
  receita:[['salario','Salário','#7E9F8B'],['extra','Renda extra','#9BB08A'],['beneficio','Benefícios','#7FA3A0'],['reembolso','Reembolso','#7D93A8'],['outros_r','Outras receitas','#A89A96']],
  despesa:[['moradia','Moradia','#A65F68'],['contas','Água, luz e internet','#7D93A8'],['alimentacao','Alimentação','#D4AF75'],['transporte','Transporte','#B98B6E'],['saude','Saúde','#8FA79A'],['educacao','Educação','#8C7AA8'],['cartao','Cartão de crédito','#C58B91'],['lazer','Lazer','#D49A8A'],['pessoal','Cuidados pessoais','#C9A15A'],['impostos','Impostos e taxas','#665653'],['outros_d','Outras despesas','#A89A96']]
};
const finCat=(type,k)=>{const c=(FIN_CATS[type]||[]).find(x=>x[0]===k)||[k,'Sem categoria','#B5A7A3'];return {k:c[0],name:c[1],color:c[2]};};
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const parseMoney=s=>{s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.round(parseFloat(s)*100)/100;};
const ymAdd=(m,n)=>addMonths(m+'-01',n).slice(0,7);
const ymName=m=>monthName(m+'-01');
function finItems(m){
  const out=[];const last=+monthEnd(m+'-01').slice(8);
  for(const e of S.fin.entries){
    if(e.recurring==='mensal'){

function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Falha ao carregar biblioteca'));document.head.appendChild(s);});}
A.rpXlsx=async el=>{
  const R=U.rp;const {a,b,label}=rpRangeFor(R.period,R.date||today());const D=rpData(a,b);
  el.disabled=true;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const X=window.XLSX;const wb=X.utils.book_new();
    const resumo=[['Relatório',S.settings.name],['Período',label],['De',fmtD(a)],['Até',fmtD(b)],['Emitido em',fmtStamp(stamp())],[],
      ['Indicador','Valor'],['Tarefas concluídas',D.completed.length],['Tarefas pendentes (prazo no período)',D.pending.length],['Tarefas atrasadas (prazo no período)',D.late.length],
      ['Tarefas criadas',D.created.length],['Compromissos no período',D.occ.length],['Compromissos realizados',D.occDone.length],['Taxa de conclusão (%)',pctOf(D.completed.length,D.completed.length+D.pending.length)]];
    X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(resumo),'Resumo');
    const tl=sortTasks([...new Set([...D.dueIn,...D.completed])]);
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(tl.map(t=>({Tarefa:t.title,Categoria:catLabel(t.categoryId,t.categoryOther),Projeto:projOf(t.projectId)?.name||'',Prioridade:PRI[t.priority]?.l||'',Status:TST[t.status],Responsável:t.assignee||'','Criada em':fmtStamp(t.createdAt),Prazo:fmtD(t.due)+(t.dueTime?' '+t.dueTime:''),'Concluída em':fmtStamp(t.completedAt),Atrasada:isLate(t)?'Sim':'Não'}))),'Tarefas');
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(D.occ.map(o=>({Data:fmtD(o.date),Início:o.start,Término:o.end,Compromisso:o.ev.title,Local:o.ev.location||'',Categoria:catLabel(o.ev.categoryId,o.ev.categoryOther),Prioridade:PRI[o.ev.priority]?.l||'',Realizado:o.done?'Sim':'Não'}))),'Compromissos');
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(S.projects.map(p=>{const s=projStats(p);return {Projeto:p.name,Categoria:catLabel(p.categoryId,p.categoryOther),Responsável:p.owner||'',Status:PST[p.status],Início:fmtD(p.start),Prazo:fmtD(p.due),'Progresso (%)':s.pct,Etapas:`${s.stagesDone}/${s.stages}`,Tarefas:`${s.tasksDone}/${s.tasks}`};})),'Projetos');
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(S.goals.map(g=>({Meta:g.name,Periodicidade:GPER[g.period]||'',Categoria:catLabel(g.categoryId,g.categoryOther),Indicador:g.unit||'',Inicial:+g.initial||0,Atual:+g.current||0,Esperado:+g.target,'Progresso (%)':goalPct(g),Prazo:fmtD(g.due)}))),'Metas');
    X.writeFile(wb,`relatorio-planner-${a}_a_${b}.xlsx`);
    toast('Planilha Excel gerada.');
  }catch(e){
    // reserva: CSV das tarefas
    const rows=[['Tarefa','Categoria','Projeto','Prioridade','Status','Prazo','Concluída em']].concat(sortTasks([...new Set([...D.dueIn,...D.completed])]).map(t=>[t.title,catLabel(t.categoryId,t.categoryOther),projOf(t.projectId)?.name||'',PRI[t.priority]?.l||'',TST[t.status],fmtD(t.due),fmtStamp(t.completedAt)]));
    const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
    downloadFile(`relatorio-planner-${a}_a_${b}.csv`,csv,'text/csv;charset=utf-8');
    toast('Sem conexão para gerar .xlsx — exportado em CSV (abre no Excel).','warn');
  }finally{el.disabled=false;}
};
function downloadFile(name,content,type){const blob=content instanceof Blob?content:new Blob([content],{type});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}

        <div class="set-row"><div><b>Lembrete padrão — tarefas</b><small>Sugerido ao criar uma tarefa</small></div><select data-ch="setNotifSel" data-k="taskDefault">${opts(remOpts,String(N.taskDefault))}</select></div>
        <div class="set-row"><div><b>Notificações do navegador</b><small>${perm==='unsupported'?'Não suportado neste navegador':perm==='denied'?'Bloqueadas no navegador — libere nas configurações do site':'Alertas na tela enquanto o planner estiver aberto'}</small></div>${perm==='unsupported'||perm==='denied'?'<span class="muted small">—</span>':sw('setBrowserNotif',N.browser&&perm==='granted')}</div></section>
      <section class="card"><div class="card-h"><h3>${ic('palette',18)}Categorias</h3><span class="sub">${S.categories.length}</span></div>
        ${S.categories.map(c=>`<div class="cat-row"><input type="color" value="${c.color}" data-ch="catColor" data-id="${c.id}" aria-label="Cor de ${esc(c.name)}"><input type="text" value="${esc(c.name)}" data-ch="catName" data-id="${c.id}" maxlength="40" aria-label="Nome da categoria"><small>${plural(usage(c.id),'uso')}</small><button class="btn-icon sm danger" data-a="catDel" data-id="${c.id}" aria-label="Excluir categoria">${ic('trash',15)}</button></div>`).join('')}
        <div class="cat-row" style="margin-top:8px;border-top:1px dashed var(--line);padding-top:12px"><input type="color" id="catNewColor" value="${PALETTE[S.categories.length%PALETTE.length]}" aria-label="Cor da nova categoria"><input type="text" id="catNewName" placeholder="Nova categoria" maxlength="40" data-enter="catAdd"><button class="btn btn-primary btn-sm" data-a="catAdd">${ic('plus',14)}Adicionar</button></div></section>
      <section class="card"><div class="card-h"><h3>${ic('cloud',18)}Sincronização entre dispositivos</h3></div>
        <div class="sync-box"><div id="syncStatus">${syncStatusHTML()}</div>
        ${Sync.user?`<p class="small" style="margin-top:6px">Conta conectada: <b>${esc(Sync.user.email||'')}</b></p><div class="row" style="margin-top:10px"><button class="btn btn-primary btn-sm" data-a="syncNow">${ic('repeat',14)}Sincronizar agora</button><button class="btn btn-ghost btn-sm" data-a="syncLogout">${ic('logout',14)}Sair</button></div>`
        :Sync.state==='unavailable'?'':`<form id="syncForm" class="form" style="margin-top:10px;gap:10px" autocomplete="on" onsubmit="return false"><div class="grid2"><label class="fld"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label><label class="fld"><span>Senha</span><input type="password" name="password" autocomplete="current-password" required></label></div><div class="row"><button class="btn btn-primary btn-sm" data-a="syncLogin">${ic('cloud',14)}Entrar e sincronizar</button><small class="hint">Use a conta criada no projeto “Planner PriSato” do Supabase.</small></div></form>`}</div></section>
      <section class="card"><div class="card-h"><h3>${ic('database',18)}Dados e backup</h3></div>
        <p class="small muted" style="margin-bottom:10px">Salvamento automático neste navegador (IndexedDB). ${plural(S.events.length,'compromisso')} · ${plural(S.tasks.length,'tarefa')} · ${plural(S.projects.length,'projeto')} · ${plural(S.goals.length,'meta')} · ${plural(S.notes.length,'anotação','anotações')} · ${plural(S.lists.length,'lista')}.</p>
        <div class="row"><button class="btn btn-ghost btn-sm" data-a="backupExport">${ic('download',14)}Exportar backup (.json)</button><label class="btn btn-ghost btn-sm file-btn">${ic('upload',14)}Restaurar backup<input type="file" accept=".json,application/json" data-ch="backupImport"></label><button class="btn btn-danger-ghost btn-sm" data-a="wipeAll">${ic('trash',14)}Apagar todos os dados</button></div></section>
    </div>
  </div>`;
};
CH.setName=el=>{const v=el.value.trim();if(!v){el.value=S.settings.name;toast('O nome não pode ficar vazio.','error');return;}commit(s=>{s.settings.name=v;},{msg:'Nome atualizado'});renderTopbar();};
CH.avatarUp=async el=>{
  const f=el.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast('Escolha um arquivo de imagem.','error');return;}
  try{
    const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=256;const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    const data=c.toDataURL('image/jpeg',.86);
    commit(st=>{st.settings.avatar=data;},{msg:'Foto atualizada'});renderTopbar();
  }catch(e){toast('Não foi possível ler a imagem.','error');}
};
A.avatarDel=async()=>{if(!(await confirmDlg('Remover a foto de perfil?',{ok:'Remover',danger:true})))return;commit(s=>{s.settings.avatar='';},{msg:'Foto removida'});renderTopbar();};
CH.setTz=el=>{commit(s=>{s.settings.tz=el.value;},{msg:'Fuso horário atualizado'});};
CH.setWeekStart=el=>commit(s=>{s.settings.weekStart=+el.value;},{msg:'Primeiro dia da semana atualizado'});
A.setTheme=el=>{commit(s=>{s.settings.theme=el.dataset.v;});const t=THEMES.find(x=>x.id===el.dataset.v);if(t)toast('Tema “'+t.n+'” aplicado');};
CH.setPref=el=>commit(s=>{s.settings[el.dataset.k]=el.dataset.k==='dayStart'?+el.value:el.value;if(el.dataset.k==='agendaView'){U.ag.view=el.value;U.ag.scrolled=false;}if(el.dataset.k==='taskView')U.tk.view=el.value;if(el.dataset.k==='dayStart')U.ag.scrolled=false;},{msg:'Preferência salva'});
CH.setBool=el=>commit(s=>{s.settings[el.dataset.k]=el.checked;},{msg:'Preferência salva'});
CH.setNotif=el=>commit(s=>{s.settings.notify[el.dataset.k]=el.checked;},{msg:'Notificações atualizadas'});
CH.setNotifNum=el=>{const v=clamp(parseInt(el.value)||0,0,60);commit(s=>{s.settings.notify[el.dataset.k]=v;},{msg:'Antecedência atualizada'});};
CH.setNotifSel=el=>commit(s=>{s.settings.notify[el.dataset.k]=el.value===''?'':+el.value;},{msg:'Preferência salva'});
CH.setBrowserNotif=async el=>{
  if(el.checked){
    let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();
    if(p!=='granted'){el.checked=false;toast('Permissão de notificação não concedida pelo navegador.','warn');render();return;}
    commit(s=>{s.settings.notify.browser=true;},{msg:'Notificações do navegador ativadas'});
    try{new Notification('Planner',{body:'As notificações do navegador estão ativadas.'});}catch(e){}
  }else commit(s=>{s.settings.notify.browser=false;},{msg:'Notificações do navegador desativadas'});
};
CH.catColor=el=>{const c=byId(S.categories,el.dataset.id);if(c)commit(()=>{c.color=el.value;},{msg:'Cor atualizada'});};
CH.catName=el=>{const c=byId(S.categories,el.dataset.id);const v=el.value.trim();if(!c)return;if(!v){el.value=c.name;toast('O nome da categoria não pode ficar vazio.','error');return;}if(S.categories.some(x=>x.id!==c.id&&norm(x.name)===norm(v))){el.value=c.name;toast('Já existe uma categoria com esse nome.','error');return;}commit(()=>{c.name=v;},{msg:'Categoria renomeada'});};
A.catAdd=()=>{const n=$('#catNewName');const v=n.value.trim();if(!v){n.classList.add('err');n.focus();toast('Informe o nome da categoria.','error');return;}if(S.categories.some(x=>norm(x.name)===norm(v))){toast('Já existe uma categoria com esse nome.','error');n.select();return;}commit(s=>s.categories.push({id:'c-'+uid(),name:v,color:$('#catNewColor').value}),{msg:'Categoria criada'});setTimeout(()=>{const i=$('#catNewName');i&&i.focus();},30);};
EN.catAdd=()=>A.catAdd();
A.catDel=async el=>{
  const c=byId(S.categories,el.dataset.id);if(!c)return;
  const n=S.tasks.filter(t=>t.categoryId===c.id).length+S.events.filter(e=>e.categoryId===c.id).length+S.projects.filter(p=>p.categoryId===c.id).length+S.goals.filter(g=>g.categoryId===c.id).length+S.notes.filter(x=>x.categoryId===c.id).length;
  if(!(await confirmDlg(`Excluir a categoria “${esc(c.name)}”?${n?`<br><br>${plural(n,'registro usa','registros usam')} esta categoria e ficará(ão) como “Sem categoria”.`:''}`,{ok:'Excluir',danger:true,title:'Excluir categoria'})))return;
  commit(s=>{s.categories=s.categories.filter(x=>x.id!==c.id);for(const k of ['tasks','events','projects','goals','notes'])s[k].forEach(r=>{if(r.categoryId===c.id)r.categoryId='';});},{msg:'Categoria excluída'});
};
A.backupExport=()=>{const n=nowTZ();downloadFile(`planner-backup-${iso(n)}.json`,JSON.stringify(S,null,1),'application/json');toast('Backup exportado.');};
CH.backupImport=async el=>{
  const f=el.files[0];el.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!data||typeof data!=='object'||!data.settings||!Array.isArray(data.tasks))throw new Error('Arquivo não parece ser um backup deste planner.');
    if(!(await confirmDlg(`Restaurar o backup “${esc(f.name)}”? Os dados atuais deste planner serão substituídos pelos do arquivo.`,{ok:'Restaurar',danger:true,title:'Restaurar backup'})))return;
    const keepSync=S.meta.syncedAt;S=normalizeState(data);S.meta.syncedAt=keepSync;
    commit(null,{msg:'Backup restaurado'});renderTopbar();
  }catch(e){toast('Não foi possível restaurar: '+e.message,'error');}
};
A.wipeAll=async()=>{
  if(!(await confirmDlg('Apagar <b>todos</b> os compromissos, tarefas, projetos, metas, anotações, listas e planejamentos deste planner?<br><br>Recomendamos exportar um backup antes. Esta ação não pode ser desfeita.',{ok:'Continuar',danger:true,title:'Apagar todos os dados'})))return;
  if(!(await confirmDlg('Confirma mesmo? Todos os dados serão apagados permanentemente'+(Sync.user?' — inclusive na nuvem, na próxima sincronização':'')+'.',{ok:'Apagar tudo',danger:true,title:'Confirmação final'})))return;
  const keep={settings:S.settings,categories:S.categories,meta:S.meta};S=defaultState();Object.assign(S,keep);
  commit(null,{msg:'Todos os dados foram apagados'});
};
A.syncLogin=async el=>{
  const f=$('#syncForm');const email=f.email.value.trim(),pw=f.password.value;
  if(!email)return fieldErr(f,'email','Informe o e-mail.');if(!pw)return fieldErr(f,'password','Informe a senha.');
  el.disabled=true;
  try{await Sync.login(email,pw);toast('Conta conectada. Sincronização ativada.');render();}
  catch(e){toast(e.message,'error');}
  finally{el.disabled=false;}
};
A.syncNow=async()=>{await Sync.pull(true);if(Sync.state==='ok')toast('Sincronização concluída.');render();};
A.syncLogout=async()=>{if(!(await confirmDlg('Sair da sincronização? Os dados continuam salvos neste dispositivo.',{ok:'Sair'})))return;await Sync.logout();toast('Sincronização desativada.');render();};

/* =====================================================================
   SOLTAR (drag-and-drop) — destino de cada arraste
   ===================================================================== */
async function onDrop(src,dst,info){
  const [sk,sid]=split1(src);const [dk,dv]=split1(dst);
  if(sk==='ev'){
    if(dk==='col'){const r=info.target.getBoundingClientRect();const m=Math.round(((info.top-r.top)/HH*60)/15)*15;await moveOcc(sid,dv,fromMin(clamp(m,0,23*60+45)));}
    else if(dk==='day')await moveOcc(sid,dv,undefined);
    return;
  }
  if(sk==='task'){
    const t=byId(S.tasks,sid);if(!t)return;
    if(dk==='tstatus'&&t.status!==dv)commit(()=>setTaskStatus(t,dv),{msg:`Tarefa movida para “${TST[dv]}”`});
    else if(dk==='tday'&&taskDay(t)!==dv)commit(()=>{t.plannedDate=dv;},{msg:`Tarefa planejada para ${DIAS_C[wd(dv)]} ${fmtDS(dv)}`});
    else if(dk==='tpool'&&t.plannedDate)commit(()=>{t.plannedDate='';},{msg:'Tarefa sem dia definido'});
    else if(dk==='tdue'&&t.due!==dv)commit(()=>{t.due=dv;},{msg:'Prazo alterado para '+fmtD(dv)});
    return;
  }
  if(sk==='proj'&&dk==='pstatus'){const p=projOf(sid);if(p&&p.status!==dv)commit(()=>{addHist(p,`Status alterado de ${PST[p.status]} para ${PST[dv]}`);p.status=dv;},{msg:`Projeto movido para “${PST[dv]}”`});}
}

/* =====================================================================
   EVENTOS GLOBAIS E INICIALIZAÇÃO
   ===================================================================== */
const SWIPE={agenda:'agNav',semana:'wkNav',mes:'moNav',ciclo:'cyYear',financas:'finNav',relatorios:'rpNav'};
const swipeAction=()=>U.route==='tarefas'?(U.tk.view==='calendario'?'tkMonth':null):(SWIPE[U.route]||null);
function canScrollX(el,n,root){for(let e=el;e&&e!==root;e=e.parentElement){const cs=getComputedStyle(e);if(/(auto|scroll)/.test(cs.overflowX)&&e.scrollWidth>e.clientWidth+2){if(n>0?e.scrollLeft+e.clientWidth<e.scrollWidth-2:e.scrollLeft>2)return true;}}return false;}
let SW=null;
function swStart(x,y,t){SW=null;if(Modal.stack.length||!swipeAction()||!t||!t.closest)return;if(!t.closest('#view')||t.closest('input,textarea,select,[data-drag],.no-swipe'))return;SW={x,y,t:Date.now(),el:t};}
function swEnd(x,y){
  const s=SW;SW=null;if(!s||(Drag.s&&Drag.s.started)||Drag.justDropped)return;
  const dx=x-s.x,dy=y-s.y;if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-s.t>900)return;
  const n=dx<0?1:-1;if(canScrollX(s.el,n,$('#view')))return;
  const a=swipeAction();if(!a||!A[a])return;
  Drag.justDropped=true;setTimeout(()=>{Drag.justDropped=false;},80);
  U.slide=n;A[a]({dataset:{n:String(n)}});
}
function bindSwipe(){
  document.addEventListener('touchstart',e=>{if(e.touches.length===1)swStart(e.touches[0].clientX,e.touches[0].clientY,e.target);else SW=null;},{passive:true});
  document.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(t&&SW)swEnd(t.clientX,t.clientY);},{passive:true});
  document.addEventListener('touchcancel',()=>{SW=null;});
  document.addEventListener('mousedown',e=>{if(e.button===0)swStart(e.clientX,e.clientY,e.target);});
  document.addEventListener('mouseup',e=>{if(SW)swEnd(e.clientX,e.clientY);});
}
function bindGlobal(){
  bindSwipe();
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-a]');
    if(Pop.open&&!e.target.closest('.pop')&&!(el&&['quickMenu','notifToggle'].includes(el.dataset.a))&&!e.target.closest('.tb-search'))Pop.close();
    if(!el)return;
    if(el.tagName==='A'&&(el.getAttribute('href')||'').startsWith('#'))e.preventDefault();
    const f=A[el.dataset.a];if(f){try{f(el,e);}catch(err){console.error(err);toast('Erro: '+err.message,'error');}}
  });
  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.dataset&&el.dataset.bind&&el.type==='checkbox'){bindSave(el);return;}
    const c=el.closest&&el.closest('[data-ch]');if(c&&CH[c.dataset.ch])CH[c.dataset.ch](c,e);
  });
  document.addEventListener('input',e=>{
    const el=e.target;if(!el.dataset)return;
    if(el.dataset.bind&&el.type!=='checkbox'){clearTimeout(el._t);setSaveState('saving');el._t=setTimeout(()=>bindSave(el),450);return;}
    if(el.dataset.in&&IN[el.dataset.in]){clearTimeout(el._t);const d=el.dataset.in==='search'?120:250;el._t=setTimeout(()=>IN[el.dataset.in](el,e),d);}
  });
  document.addEventListener('focusout',e=>{const el=e.target;if(el.dataset&&el.dataset.bind&&el._t){clearTimeout(el._t);el._t=null;bindSave(el);}});
  document.addEventListener('keydown',e=>{
    const t=e.target;
    if(e.key==='Enter'&&t.dataset&&t.dataset.enter&&EN[t.dataset.enter]&&!e.isComposing){e.preventDefault();EN[t.dataset.enter](t,e);if(document.activeElement===t||t.isConnected)t.value='';return;}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&t.id==='ideaText'){e.preventDefault();A.ideaSave();return;}
    if(t.id==='searchInput'){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const b=$$('#popSearch .sr');if(!b.length)return;SRi=(SRi+(e.key==='ArrowDown'?1:-1)+b.length)%b.length;b.forEach((x,i)=>x.classList.toggle('sel',i===SRi));b[SRi].scrollIntoView({block:'nearest'});return;}
      if(e.key==='Enter'){e.preventDefault();const b=$$('#popSearch .sr')[SRi];if(b)A.srOpen(b);return;}
      if(e.key==='Escape'){t.value='';Pop.close();t.blur();return;}
    }
    if(e.key==='Escape'){if(Pop.open){Pop.close();return;}if(Modal.top()){Modal.request();return;}$('#app').classList.remove('drawer');}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const s=$('#searchInput');s.focus();s.select();}
  });
  $('#main').addEventListener('scroll',()=>{if(Pop.open==='popSearch')return;},{passive:true});
  document.addEventListener('focusin',e=>{if(e.target.id==='searchInput'&&e.target.value.trim().length>=2)renderSearch();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(persistT){clearTimeout(persistT);persist(true);}}else tick();});
  window.addEventListener('pagehide',()=>{if(persistT){clearTimeout(persistT);persist(true);}});
}
function tick(){
  refreshChrome();browserNotify();
  if(pruneNotif())persist();
  const busy=Modal.stack.length||Drag.s||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if(!busy&&['dashboard','agenda'].includes(U.route))render();
}
async function init(){
  await Store.open();
  const saved=await Store.get('state');
  S=normalizeState(saved);
  const td=today();
  U.ag.view=S.settings.agendaView||'semana';U.ag.date=td;U.tk.view=S.settings.taskView||'lista';U.wk.date=td;U.mo.date=td;U.rp.date=td;U.tk.month=td;
  const r=(location.hash||'').replace('#/','');if(VIEWS[r])U.route=r;
  bindGlobal();Drag.init();
  renderTopbar();render();
  const boot=$('#boot');if(boot){boot.style.transition='opacity .3s';boot.style.opacity='0';setTimeout(()=>boot.remove(),300);}
  if(!Store.db)toast('IndexedDB indisponível — usando o armazenamento básico do navegador.','warn');
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  Sync.init();
  setInterval(tick,30000);
  setTimeout(tick,1500);
}
document.addEventListener('DOMContentLoaded',init);
</script>
