<script>
'use strict';
/* =====================================================================
   NÚCLEO — utilidades, datas, estado e persistência
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,'0');
const plural=(n,s,p)=>`${n} ${n===1?s:(p||s+'s')}`;
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
const pctOf=(a,b)=>b?Math.round(a/b*100):0;
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const split1=s=>{const i=s.indexOf(':');return [s.slice(0,i),s.slice(i+1)];};

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_C=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DIAS_C=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

/* ---------- Datas (sempre strings AAAA-MM-DD no relógio do fuso configurado) ---------- */
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d);};
const addMonths=(s,n)=>{const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const wd=s=>parseD(s).getDay();
const ym=s=>s.slice(0,7);
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const fmtD=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'';
const fmtDS=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}`:'';
const fmtLong=s=>{const d=parseD(s);return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;};
const monthName=s=>cap(MESES[+s.slice(5,7)-1])+' de '+s.slice(0,4);
const toMin=t=>t&&/^\d{2}:\d{2}/.test(t)?(+t.slice(0,2))*60+(+t.slice(3,5)):null;
const fromMin=m=>{m=clamp(Math.round(m),0,24*60-1);return pad(Math.floor(m/60))+':'+pad(m%60);};
const monthStart=s=>s.slice(0,8)+'01';
const monthEnd=s=>{const d=parseD(s);return iso(new Date(d.getFullYear(),d.getMonth()+1,0,12));};
function nowTZ(){
  try{
    const p=new Intl.DateTimeFormat('en-CA',{timeZone:(S&&S.settings.tz)||'America/Fortaleza',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    const g=t=>+p.find(x=>x.type===t).value;
    return new Date(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'),g('second'));
  }catch(e){return new Date();}
}
const today=()=>iso(nowTZ());
const nowMin=()=>{const n=nowTZ();return n.getHours()*60+n.getMinutes();};
const stamp=()=>{const n=nowTZ();return iso(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes());};
const fmtStamp=s=>s?fmtD(s.slice(0,10))+(s.length>10?' às '+s.slice(11,16):''):'';
const weekStart=s=>{const off=(wd(s)-(+S.settings.weekStart)+7)%7;return addDays(s,-off);};
const weekDays=s=>{const a=weekStart(s);return [0,1,2,3,4,5,6].map(i=>addDays(a,i));};
const dt=(date,time)=>{const d=parseD(date);const m=toMin(time)||0;d.setHours(Math.floor(m/60),m%60,0,0);return d;};
const relDay=s=>{if(!s)return'';const n=diffDays(today(),s);if(n===0)return'Hoje';if(n===1)return'Amanhã';if(n===-1)return'Ontem';if(n>1&&n<7)return cap(DIAS[wd(s)]);return fmtD(s);};
const weekTitle=ds=>{const a=parseD(ds[0]),b=parseD(ds[6]);return a.getMonth()===b.getMonth()?`${a.getDate()} a ${b.getDate()} de ${MESES[b.getMonth()]} de ${b.getFullYear()}`:`${a.getDate()} de ${MESES[a.getMonth()]} a ${b.getDate()} de ${MESES[b.getMonth()]} de ${b.getFullYear()}`;};

/* ---------- Constantes de domínio ---------- */
const PRI={baixa:{l:'Baixa',w:1},media:{l:'Média',w:2},alta:{l:'Alta',w:3},urgente:{l:'Urgente',w:4}};
const TST={nao_iniciada:'Não iniciada',em_andamento:'Em andamento',aguardando:'Aguardando',concluida:'Concluída',cancelada:'Cancelada'};
const PST={planejamento:'Planejamento',em_andamento:'Em andamento',pausado:'Pausado',concluido:'Concluído',cancelado:'Cancelado'};
const GPER={diaria:'Diária',semanal:'Semanal',mensal:'Mensal',anual:'Anual'};
const REM_OPTS=[[0,'No horário'],[15,'15 minutos antes'],[30,'30 minutos antes'],[60,'1 hora antes'],[1440,'1 dia antes']];
const REC={none:'Não se repete',daily:'Diariamente',weekly:'Semanalmente',biweekly:'Quinzenalmente',monthly:'Mensalmente',yearly:'Anualmente',custom:'Personalizado…'};
const PALETTE=['#A65F68','#C58B91','#D4AF75','#B98B6E','#8FA79A','#7D93A8','#9C88B0','#665653','#C9A15A','#D49A8A'];
const NOTE_COLORS=[['#FFFFFF','Branco'],['#F5E9E7','Rosé'],['#F7EFE1','Dourado'],['#EEF3EF','Sálvia'],['#ECEFF4','Névoa'],['#F2EDF5','Lavanda']];
const TZS=[['America/Fortaleza','Fortaleza (UTC−3)'],['America/Recife','Recife (UTC−3)'],['America/Bahia','Salvador (UTC−3)'],['America/Sao_Paulo','São Paulo / Brasília (UTC−3)'],['America/Belem','Belém (UTC−3)'],['America/Maceio','Maceió (UTC−3)'],['America/Araguaina','Palmas (UTC−3)'],['America/Manaus','Manaus (UTC−4)'],['America/Cuiaba','Cuiabá (UTC−4)'],['America/Campo_Grande','Campo Grande (UTC−4)'],['America/Porto_Velho','Porto Velho (UTC−4)'],['America/Boa_Vista','Boa Vista (UTC−4)'],['America/Rio_Branco','Rio Branco (UTC−5)'],['America/Noronha','Fernando de Noronha (UTC−2)']];
const LIST_TPL=['Lista de compras','Coisas para resolver','Assuntos para reuniões','Ideias futuras','Livros para ler','Cursos para realizar','Itens para adquirir'];
const MOTIV=[
  'Um passo de cada vez, com calma e intenção.',
  'Organizar é um gesto de cuidado consigo mesma.',
  'Pequenos progressos diários constroem grandes conquistas.',
  'Foque no que importa; o resto encontra o seu lugar.',
  'Hoje é uma página em branco — escreva-a com leveza.',
  'Constância vale mais do que pressa.',
  'Planejar é transformar intenção em realidade.',
  'Celebre cada tarefa concluída.',
  'Clareza traz tranquilidade.',
  'Faça do seu tempo um aliado.',
  'O essencial merece o seu melhor horário.',
  'Gentileza com o próprio ritmo também é produtividade.',
  'Uma rotina bem cuidada liberta a mente.',
  'Comece pelo mais importante, não pelo mais urgente.',
  'Respire, priorize e siga em frente.',
  'Seus objetivos merecem um lugar na agenda.',
  'Disciplina é lembrar o que você realmente quer.',
  'Menos dispersão, mais presença.',
  'Bons dias são planejados com carinho.',
  'Cada escolha organizada é um presente para o seu futuro.'
];

/* ---------- Estado ---------- */
const EXTRA_CATS=[{id:'c-clinica',name:'Clínica',color:'#7FA3A0'},{id:'c-midori',name:'Midori',color:'#9BB08A'},{id:'c-reino',name:'Reino',color:'#B8935A'},{id:'c-pos',name:'Pós Graduação',color:'#8C7AA8'},{id:'c-outros',name:'Outros',color:'#A89A96'}];
function defaultState(){
  return {
    version:1,
    meta:{updatedAt:0,syncedAt:0,createdAt:Date.now(),cats2:true},
    settings:{
      name:'Priscila Sato',avatar:'',theme:'light',weekStart:1,tz:'America/Fortaleza',
      agendaView:'semana',taskView:'lista',dayStart:7,sidebarCollapsed:false,showMotivation:true,showHolidays:true,
      notify:{browser:false,events:true,tasks:true,projects:true,goals:true,reminders:true,bills:true,eventDefault:15,taskDefault:'',projectDays:3,goalDays:3}
    },
    categories:[
      {id:'c-trab',name:'Trabalho',color:'#A65F68'},{id:'c-pess',name:'Pessoal',color:'#C58B91'},
      {id:'c-saude',name:'Saúde',color:'#8FA79A'},{id:'c-est',name:'Estudos',color:'#7D93A8'},
      {id:'c-fam',name:'Família',color:'#D4AF75'},{id:'c-fin',name:'Finanças',color:'#B98B6E'},
      {id:'c-ideias',name:'Ideias',color:'#9C88B0'},...EXTRA_CATS.map(c=>({...c}))
    ],
    events:[],tasks:[],projects:[],goals:[],notes:[],lists:[],reminders:[],weeks:{},months:{},cycle:{periods:[],duration:5,cycleLen:28},fin:{entries:[]},
    notif:{read:{},dismissed:{}}
  };
}
function normalizeState(s){
  const d=defaultState();
  if(!s||typeof s!=='object')return d;
  const o={...d,...s};
  o.meta={...d.meta,...(s.meta||{})};
  o.settings={...d.settings,...(s.settings||{})};
  o.settings.notify={...d.settings.notify,...((s.settings||{}).notify||{})};
  o.notif={...d.notif,...(s.notif||{})};
  for(const k of ['events','tasks','projects','goals','notes','lists','reminders','categories'])if(!Array.isArray(o[k]))o[k]=clone(d[k]);
  for(const k of ['weeks','months'])if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]={};
  o.cycle={...d.cycle,...(s.cycle&&typeof s.cycle==='object'?s.cycle:{})};if(!Array.isArray(o.cycle.periods))o.cycle.periods=[];
  o.fin={...d.fin,...(s.fin&&typeof s.fin==='object'?s.fin:{})};if(!Array.isArray(o.fin.entries))o.fin.entries=[];
  if(!(s.meta&&s.meta.cats2)){for(const c of EXTRA_CATS)if(!o.categories.some(x=>x.id===c.id||norm(x.name)===norm(c.name)))o.categories.push({...c});o.meta.cats2=true;}
  return o;
}
let S=defaultState();
const hasData=s=>['events','tasks','projects','goals','notes','lists','reminders'].some(k=>(s[k]||[]).length)||Object.keys(s.weeks||{}).length||Object.keys(s.months||{}).length||!!(s.cycle&&s.cycle.periods&&s.cycle.periods.length)||!!(s.fin&&s.fin.entries&&s.fin.entries.length);

/* ---------- Persistência local (IndexedDB, com localStorage como reserva) ---------- */
const Store={
  db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('planner-priscila',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true);};r.onerror=()=>res(false);r.onblocked=()=>res(false);}catch(e){res(false);}});},
  get(k){
    if(!this.db){try{return Promise.resolve(JSON.parse(localStorage.getItem('pps_'+k)));}catch(e){return Promise.resolve(null);}}
    return new Promise(res=>{try{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result??null);t.onerror=()=>res(null);}catch(e){res(null);}});
  },
  set(k,v){
    if(!this.db){try{localStorage.setItem('pps_'+k,JSON.stringify(v));return Promise.resolve(true);}catch(e){return Promise.resolve(false);}}
    return new Promise(res=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(JSON.parse(JSON.stringify(v)),k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);}catch(e){res(false);}});
  }
};
let persistT=null,saveFailed=false;
function persist(immediate){
  clearTimeout(persistT);
  setSaveState('saving');
  const run=()=>Store.set('state',S).then(ok=>{
    if(!ok){saveFailed=true;setSaveState('error');toast('Não foi possível salvar neste navegador. Verifique o espaço disponível ou exporte um backup.','error');}
    else{saveFailed=false;setSaveState(Sync.user?Sync.state:'ok');}
  });
  if(immediate)return run();
  persistT=setTimeout(run,200);
}
function commit(fn,opt={}){
  try{fn&&fn(S);}catch(e){console.error(e);toast('Erro: '+e.message,'error');return false;}
  S.meta.updatedAt=Date.now();
  persist();
  Sync.schedule();
  if(opt.render===false)refreshChrome();else render();
  if(opt.msg)toast(opt.msg);
  return true;
}

/* ---------- Ajudantes de domínio ---------- */
const byId=(arr,id)=>arr.find(x=>x.id===id);
const catOf=id=>byId(S.categories,id)||{id:'',name:'Sem categoria',color:'#B5A7A3'};
const projOf=id=>id?byId(S.projects,id):null;
const isOutros=id=>!!id&&norm(catOf(id).name)==='outros';
const catLabel=(id,other)=>isOutros(id)&&other?other:catOf(id).name;
const catChip=(id,other)=>{const c=catOf(id);return `<span class="chip" style="--c:${c.color}" ${isOutros(id)&&other?'title="Outros"':''}><i></i>${esc(catLabel(id,other))}</span>`;};
const priPill=p=>p&&PRI[p]?`<span class="pri pri-${p}">${PRI[p].l}</span>`:'';
const stPill=s=>`<span class="st st-${s}">${esc(TST[s]||PST[s]||s)}</span>`;
const prog=(p,cls='')=>`<div class="prog ${cls}"><i style="--p:${clamp(p,0,100)}%"></i></div>`;

const isOpen=t=>t.status!=='concluida'&&t.status!=='cancelada';
const isLate=t=>{if(!isOpen(t)||!t.due)return false;const td=today();return t.due<td||(t.due===td&&!!t.dueTime&&toMin(t.dueTime)<nowMin());};
const taskDay=t=>t.plannedDate||t.due||'';
const subProg=t=>{const L=[...(t.subtasks||[]),...(t.checklist||[])];return L.length?`${L.filter(x=>x.done).length}/${L.length}`:'';};
const addHist=(p,text)=>{(p.history||(p.history=[])).unshift({at:stamp(),text});if(p.history.length>300)p.history.length=300;};
function setTaskStatus(t,st){
  const prev=t.status;if(prev===st)return;
  t.status=st;
  if(st==='concluida')t.completedAt=stamp();else t.completedAt=null;
  const p=projOf(t.projectId);if(p)addHist(p,`Tarefa “${t.title}”: ${TST[st]}`);
}
function projStats(p){
  const st=p.stages||[];const tk=S.tasks.filter(t=>t.projectId===p.id&&t.status!=='cancelada');
  const sd=st.filter(s=>s.done).length,td=tk.filter(t=>t.status==='concluida').length;
  const total=st.length+tk.length,done=sd+td;
  return {stages:st.length,stagesDone:sd,tasks:tk.length,tasksDone:td,total,done,pct:total?Math.round(done/total*100):(p.status==='concluido'?100:0)};
}
const projOpen=p=>p.status!=='concluido'&&p.status!=='cancelado';
function goalPct(g){
  const t=+g.target,c=+g.current||0,i=+g.initial||0;
  if(!isFinite(t)||t===i)return (t&&c>=t)?100:0;
  return clamp(Math.round((c-i)/(t-i)*100),0,100);
}
const goalOpen=g=>goalPct(g)<100;
const fmtNum=v=>{const n=+v;return isFinite(n)?n.toLocaleString('pt-BR',{maximumFractionDigits:2}):'—';};

/* ---------- Recorrência de compromissos ---------- */
function occDates(ev,from,to){
  const r=ev.recurrence||{type:'none'};const skip=ev.skip||[];
  if(!r.type||r.type==='none')return (ev.date>=from&&ev.date<=to)?[ev.date]:[];
  const out=[];const start=ev.date;const end=(r.until&&r.until<to)?r.until:to;
  if(start>end||from>end)return out;
  let unit='day',n=Math.max(1,parseInt(r.interval)||1),wds=null;
  switch(r.type){
    case'daily':unit='day';n=1;break;
    case'weekly':unit='week';n=1;break;
    case'biweekly':unit='week';n=2;break;
    case'monthly':unit='month';n=1;break;
    case'yearly':unit='year';n=1;break;
    case'custom':unit=r.unit||'day';break;
  }
  const push=d=>{if(d>=from&&d<=end&&d>=start&&!skip.includes(d))out.push(d);};
  if(unit==='day'){
    let d=start;
    if(from>start){d=addDays(start,Math.floor(diffDays(start,from)/n)*n);}
    for(let i=0;d<=end&&i<4000;i++,d=addDays(d,n))push(d);
  }else if(unit==='week'){
    wds=(r.weekdays&&r.weekdays.length?r.weekdays.map(Number):[wd(start)]).sort((a,b)=>a-b);
    const anchor=addDays(start,-wd(start));let w=anchor;
    if(from>anchor){w=addDays(anchor,Math.floor(diffDays(anchor,from)/(7*n))*7*n);}
    for(let i=0;w<=end&&i<1500;i++,w=addDays(w,7*n))for(const x of wds)push(addDays(w,x));
  }else{
    const sd=parseD(start);const day=sd.getDate();const step=unit==='month'?n:12*n;let i=0;
    if(from>start){const f=parseD(from);const md=(f.getFullYear()-sd.getFullYear())*12+f.getMonth()-sd.getMonth();i=Math.max(0,Math.floor(md/step)-1)*step;}
    for(let g=0;g<2000;g++,i+=step){
      const d=new Date(sd.getFullYear(),sd.getMonth()+i,1,12);
      if(iso(d)>end)break;
      const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      if(day>last)continue;
      d.setDate(day);push(iso(d));
    }
  }
  return out;
}
const isRec=ev=>!!(ev.recurrence&&ev.recurrence.type&&ev.recurrence.type!=='none');
function mkOcc(ev,d){
  const rec=isRec(ev);
  return {ev,date:d,key:ev.id+'@'+d,start:ev.start||'',end:ev.end||'',rec,done:rec?(ev.doneDates||[]).includes(d):!!ev.done,color:ev.color||catOf(ev.categoryId).color};
}
function occList(from,to,filter){
  const out=[];
  for(const ev of S.events){if(filter&&!filter(ev))continue;for(const d of occDates(ev,from,to))out.push(mkOcc(ev,d));}
  return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||'')||a.ev.title.localeCompare(b.ev.title));
}
const occOn=(d,f)=>occList(d,d,f);
function occByKey(key){const i=key.lastIndexOf('@');const ev=byId(S.events,key.slice(0,i));return ev?mkOcc(ev,key.slice(i+1)):null;}
const recText=ev=>{const r=ev.recurrence||{};if(!isRec(ev))return'';if(r.type!=='custom')return REC[r.type];const u={day:'dia(s)',week:'semana(s)',month:'mês(es)',year:'ano(s)'}[r.unit||'day'];return `A cada ${r.interval||1} ${u}`;};

/* ---------- Feriados e datas comemorativas (calculados) ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return iso(new Date(y,mo-1,da,12));}
const _hol={};
function holidays(y){
  if(_hol[y])return _hol[y];
  const e=easter(y);
  const nthSun=(m,n)=>{const d=new Date(y,m,1,12);const off=(7-d.getDay())%7;return iso(new Date(y,m,1+off+7*(n-1),12));};
  const L=[[`${y}-01-01`,'Confraternização Universal',1],[addDays(e,-48),'Carnaval',0],[addDays(e,-47),'Carnaval',0],[addDays(e,-46),'Quarta-feira de Cinzas',0],
    [`${y}-03-08`,'Dia Internacional da Mulher',0],[addDays(e,-2),'Sexta-feira Santa',1],[e,'Páscoa',0],[`${y}-04-21`,'Tiradentes',1],[`${y}-05-01`,'Dia do Trabalho',1],
    [nthSun(4,2),'Dia das Mães',0],[`${y}-06-12`,'Dia dos Namorados',0],[addDays(e,60),'Corpus Christi',0],[nthSun(7,2),'Dia dos Pais',0],
    [`${y}-09-07`,'Independência do Brasil',1],[`${y}-10-12`,'Nossa Senhora Aparecida',1],[`${y}-10-15`,'Dia do Professor',0],[`${y}-11-02`,'Finados',1],
    [`${y}-11-15`,'Proclamação da República',1],[`${y}-11-20`,'Consciência Negra',1],[`${y}-12-24`,'Véspera de Natal',0],[`${y}-12-25`,'Natal',1],[`${y}-12-31`,'Véspera de Ano-Novo',0]];
  const m={};for(const [d,n,f] of L)(m[d]||(m[d]=[])).push({name:n,feriado:!!f});
  return _hol[y]=m;
}
const holOn=d=>S.settings.showHolidays?(holidays(+d.slice(0,4))[d]||[]):[];
function holBetween(a,b){const out=[];if(!S.settings.showHolidays)return out;for(let y=+a.slice(0,4);y<=+b.slice(0,4);y++)for(const [d,L] of Object.entries(holidays(y)))if(d>=a&&d<=b)L.forEach(h=>out.push({date:d,...h}));return out.sort((x,y)=>x.date.localeCompare(y.date));}

/* ---------- Prazos consolidados ---------- */
function deadlines(from,to,{late=false}={}){
  const L=[];const td=today();
  const inR=d=>d&&((d>=from&&d<=to)||(late&&d<td));
  for(const t of S.tasks)if(isOpen(t)&&inR(t.due))L.push({type:'task',date:t.due,time:t.dueTime||'',title:t.title,ref:t.id,sub:'Tarefa'+(t.projectId&&projOf(t.projectId)?' · '+projOf(t.projectId).name:''),late:isLate(t)});
  for(const p of S.projects){
    if(!projOpen(p))continue;
    if(inR(p.due))L.push({type:'project',date:p.due,title:p.name,ref:p.id,sub:'Entrega do projeto',late:p.due<td});
    for(const s of p.stages||[])if(!s.done&&inR(s.due))L.push({type:'project',date:s.due,title:s.title,ref:p.id,sub:'Etapa · '+p.name,late:s.due<td});
  }
  for(const g of S.goals)if(goalOpen(g)&&inR(g.due))L.push({type:'goal',date:g.due,title:g.name,ref:g.id,sub:'Prazo da meta',late:g.due<td});
  return L.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'99').localeCompare(b.time||'99'));
}
function dlList(L,empty='Nenhum prazo no período.'){
  if(!L.length)return `<div class="empty sm">${empty}</div>`;
  return `<div class="dl-list">${L.map(x=>{const d=parseD(x.date);return `<button class="dl ${x.late?'late':''}" data-a="openRef" data-type="${x.type}" data-id="${x.ref}"><div class="d"><b>${d.getDate()}</b><small>${MESES_C[d.getMonth()]}</small></div><div class="t"><b>${esc(x.title)}</b><small>${esc(x.sub)} · ${x.late?'<span class="late-t">atrasado</span>':relDay(x.date)}${x.time?' às '+x.time:''}</small></div></button>`;}).join('')}</div>`;
}

   ===================================================================== */
const A={};   // ações de clique  (data-a)
const CH={};  // ações de change  (data-ch)
const IN={};  // ações de input   (data-in, com atraso)
const EN={};  // ações de Enter   (data-enter)
const VIEWS={},AFTER={};

function toast(msg,type='ok'){
  const w=$('#toasts');if(!w)return;
  const el=document.createElement('div');el.className='toast toast-'+type;
  el.innerHTML=`${ic(type==='error'||type==='warn'?'alert':'check',16)}<span>${esc(msg)}</span>`;
  w.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},type==='error'?5200:2600);
}
function setSaveState(st){
  const el=$('#saveState');if(!el)return;
  const map={ok:['check','Salvo'],saving:['clock','Salvando…'],pending:['clock','Sincronizando…'],synced:['cloud','Sincronizado'],error:['alert','Erro ao salvar'],offline:['alert','Sem conexão com a nuvem']};
  const [i,t]=map[st]||map.ok;
  el.className='save-state '+st;el.innerHTML=`${ic(i,14)}<span>${t}</span>`;
  el.title=st==='synced'?'Dados salvos neste dispositivo e na nuvem':st==='offline'?(Sync.lastError||'Não foi possível sincronizar'):'Dados salvos automaticamente neste dispositivo';
}

/* ---------- Modais ---------- */
const Modal={
  stack:[],
  open({title,body,foot='',size='',onClose}){
    const el=document.createElement('div');el.className='modal-wrap';
    el.innerHTML=`<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${title}</h3><button type="button" class="btn-icon" data-a="modalClose" aria-label="Fechar">${ic('x')}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
    el.addEventListener('mousedown',e=>{el._down=e.target===el;});
    el.addEventListener('click',e=>{if(e.target===el&&el._down)Modal.request();});
    document.body.appendChild(el);
    this.stack.push({el,onClose});
    requestAnimationFrame(()=>el.classList.add('show'));
    const f=el.querySelector('[autofocus]');if(f&&matchMedia('(pointer:fine)').matches)setTimeout(()=>f.focus(),80);
    return el;
  },
  close(v){
    const m=this.stack.pop();if(!m)return;
    m.el.classList.remove('show');setTimeout(()=>m.el.remove(),180);
    m.onClose&&m.onClose(v);
  },
  async request(){
    const m=this.stack[this.stack.length-1];if(!m)return;
    const f=m.el.querySelector('form[data-dirty]');
    if(f&&!(await confirmDlg('Há alterações não salvas neste formulário. Deseja descartá-las?',{ok:'Descartar',danger:true,title:'Descartar alterações?'})))return;
    if(this.stack[this.stack.length-1]===m)this.close();
  },
  top(){return this.stack.length?this.stack[this.stack.length-1].el:null;}
};

function formModal({title,body,size='',left=[],onSave,saveLabel='Salvar'}){
  const el=Modal.open({title,size,
    body:`<form class="form" novalidate autocomplete="off">${body}<button type="submit" hidden></button></form>`,
    foot:`<div class="mf-left">${left.map((b,i)=>`<button type="button" class="btn ${b.cls||'btn-ghost'} btn-sm" data-li="${i}">${b.icon?ic(b.icon,15):''}${b.l}</button>`).join('')}</div><div class="mf-right"><button type="button" class="btn btn-ghost" data-cancel>Cancelar</button><button type="button" class="btn btn-primary" data-save>${ic('check',16)}${saveLabel}</button></div>`});
  const form=$('form',el);let busy=false;
  const run=async()=>{
    if(busy)return;busy=true;const b=$('[data-save]',el);b.disabled=true;
    try{
      const cs=form.elements.categoryId,co=form.elements.categoryOther;
      if(cs&&co&&isOutros(cs.value)&&!co.value.trim()){co.hidden=false;fieldErr(form,'categoryOther','Especifique a categoria escolhida em “Outros”.');return;}const ok=await onSave(form,el);if(ok!==false&&Modal.stack.some(m=>m.el===el)){while(Modal.top()&&Modal.top()!==el)Modal.close();Modal.close(true);}}
    catch(e){console.error(e);toast('Não foi possível salvar: '+e.message,'error');}
    finally{busy=false;b.disabled=false;}
  };
  form.addEventListener('submit',e=>{e.preventDefault();run();});
  $('[data-save]',el).onclick=run;
  $('[data-cancel]',el).onclick=()=>Modal.request();
  left.forEach((b,i)=>$(`[data-li="${i}"]`,el).onclick=()=>b.fn(form,el));
  const dirty=e=>{if(e.target.dataset.nodirty===undefined)form.dataset.dirty='1';e.target.classList.remove('err');};
  form.addEventListener('input',dirty);form.addEventListener('change',dirty);
  form.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const t=e.target;
    if(t.matches('.r-text,.r-label,.r-url')){e.preventDefault();const rows=t.closest('[data-rows]');rows.insertAdjacentHTML('beforeend',rowHTML(rows.dataset.rows));$('.row-it:last-child .r-text, .row-it:last-child .r-label',rows).focus();}
  });
  return el;
}

/* ---------- Arrastar e soltar (mouse e toque) ---------- */
const Drag={
  s:null,justDropped:false,
  init(){
    document.addEventListener('mousedown',e=>{if(e.button)return;const el=this.src(e);if(!el)return;this.s={el,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,started:false};});
    document.addEventListener('mousemove',e=>{const s=this.s;if(!s)return;s.lx=e.clientX;s.ly=e.clientY;if(!s.started){if(Math.hypot(e.clientX-s.x,e.clientY-s.y)<6)return;this.start();}e.preventDefault();this.move(e.clientX,e.clientY);});
    document.addEventListener('mouseup',()=>{const s=this.s;if(!s)return;if(s.started)this.drop(s.lx,s.ly);this.s=null;});
    document.addEventListener('touchstart',e=>{
      const el=this.src(e);if(!el||e.touches.length>1)return;const t=e.touches[0];
      this.s={el,x:t.clientX,y:t.clientY,lx:t.clientX,ly:t.clientY,started:false,touch:true};
      this.s.timer=setTimeout(()=>{const s=this.s;if(s&&!s.started){this.start();this.move(s.lx,s.ly);navigator.vibrate&&navigator.vibrate(12);}},380);
    },{passive:true});
    document.addEventListener('touchmove',e=>{
      const s=this.s;if(!s)return;const t=e.touches[0];s.lx=t.clientX;s.ly=t.clientY;
      if(!s.started){if(Math.hypot(t.clientX-s.x,t.clientY-s.y)>10){clearTimeout(s.timer);this.s=null;}return;}
      if(e.cancelable)e.preventDefault();this.move(t.clientX,t.clientY);
    },{passive:false});
    document.addEventListener('touchend',e=>{const s=this.s;if(!s)return;clearTimeout(s.timer);if(s.started){if(e.cancelable)e.preventDefault();this.drop(s.lx,s.ly);}this.s=null;});
    document.addEventListener('touchcancel',()=>{if(this.s){clearTimeout(this.s.timer);this.cleanup();this.s=null;}});
    document.addEventListener('contextmenu',e=>{if(this.s&&this.s.touch)e.preventDefault();});
    document.addEventListener('click',e=>{if(this.justDropped){e.stopPropagation();e.preventDefault();this.justDropped=false;}},true);
  },
  src(e){const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return null;if(e.target.closest('input,select,textarea,a,.tick,[data-nodrag]'))return null;return el;},
  start(){
    const s=this.s;s.started=true;const r=s.el.getBoundingClientRect();s.ox=s.x-r.left;s.oy=s.y-r.top;
    const g=s.el.cloneNode(true);g.classList.add('drag-ghost');g.removeAttribute('data-drag');g.style.width=r.width+'px';g.style.height=Math.min(r.height,90)+'px';
    document.body.appendChild(g);s.g=g;s.el.classList.add('dragging');document.body.classList.add('is-dragging');
    s.scroller=s.el.closest('[data-keep-scroll]');
    s.raf=null;
  },
  move(x,y){
    const s=this.s;if(!s||!s.g)return;
    s.g.style.transform=`translate(${x-s.ox}px,${y-s.oy}px)`;
    const t=this.target(x,y);
    if(t!==s.over){s.over&&s.over.classList.remove('drop-over');t&&t.classList.add('drop-over');s.over=t;}
    // rolagem automática perto das bordas
    const sc=(document.elementFromPoint(x,y)||document.body).closest('[data-keep-scroll]')||$('#main');
    const r=sc.getBoundingClientRect();let dy=0,dx=0;
    if(y<r.top+40)dy=-14;else if(y>r.bottom-40)dy=14;
    if(x<r.left+30)dx=-14;else if(x>r.right-30)dx=14;
    if(dy||dx)sc.scrollBy(dx,dy);
  },
  target(x,y){const el=document.elementFromPoint(x,y);return el?el.closest('[data-drop]'):null;},
  drop(x,y){
    const s=this.s;const t=this.target(x,y);const spec=s.el.dataset.drag;const top=y-s.oy;
    this.cleanup();this.justDropped=true;setTimeout(()=>{this.justDropped=false;},60);
    if(t)onDrop(spec,t.dataset.drop,{x,y,top,target:t});
  },
  cleanup(){const s=this.s;if(!s)return;s.g&&s.g.remove();s.el.classList.remove('dragging');s.over&&s.over.classList.remove('drop-over');document.body.classList.remove('is-dragging');}
};

/* ---------- Notificações (derivadas de registros reais) ---------- */
let NOTIFS=[];
const PUSHED=(()=>{try{return JSON.parse(localStorage.getItem('pps_pushed')||'{}');}catch(e){return {};}})();
function buildNotifs(){
  const P=S.settings.notify;const L=[];const n=nowTZ();const ts=n.getTime();const td=iso(n);
  if(P.events){
    for(const o of occList(addDays(td,-1),addDays(td,2))){
      if(o.done)continue;const rem=(o.ev.reminders||[]).map(Number).filter(x=>x>=0);if(!rem.length)continue;
      const st=dt(o.date,o.start||'08:00').getTime();
      if(ts-st>4*3600e3)continue;
      for(const m of [...rem].sort((a,b)=>a-b)){
        const trig=st-m*60000;
        if(trig<=ts){
          const when=ts<st?(m>=1440?`${relDay(o.date)}${o.start?' às '+o.start:''}`:`Começa às ${o.start||'—'}`):`Começou às ${o.start||'—'}`;
          L.push({key:`ev:${o.key}:${m}`,kind:'event',at:trig,title:o.ev.title,text:`${o.ev.title?'Compromisso':''} · ${when}${o.ev.location?' · '+o.ev.location:''}`,go:{t:'occ',id:o.key}});
          break;
        }
      }
    }
  }
  if(P.tasks){
    for(const t of S.tasks){
      if(!isOpen(t))continue;
      if(isLate(t)){L.push({key:`late:${t.id}:${t.due}`,kind:'late',at:dt(t.due,t.dueTime||'23:59').getTime(),title:t.title,text:`Tarefa atrasada · prazo ${fmtD(t.due)}${t.dueTime?' às '+t.dueTime:''}`,go:{t:'task',id:t.id}});continue;}
      if(t.due&&t.reminder!==''&&t.reminder!=null&&+t.reminder>=0){
        const st=dt(t.due,t.dueTime||'09:00').getTime();const trig=st-(+t.reminder)*60000;
        if(trig<=ts)L.push({key:`tdue:${t.id}:${t.due}:${t.reminder}`,kind:'task',at:trig,title:t.title,text:`Prazo da tarefa: ${relDay(t.due).toLowerCase()}${t.dueTime?' às '+t.dueTime:''}`,go:{t:'task',id:t.id}});
      }
    }
  }
  if(P.projects){
    for(const p of S.projects){
      if(!projOpen(p)||!p.due)continue;const dd=diffDays(td,p.due);
      if(dd<0)L.push({key:`plate:${p.id}:${p.due}`,kind:'late',at:dt(p.due,'23:59').getTime(),title:p.name,text:`Entrega do projeto atrasada (prazo ${fmtD(p.due)})`,go:{t:'project',id:p.id}});
      else if(dd<=(+P.projectDays||0))L.push({key:`pdue:${p.id}:${p.due}`,kind:'project',at:dt(addDays(p.due,-(+P.projectDays||0)),'08:00').getTime(),title:p.name,text:dd===0?'Entrega do projeto é hoje':`Entrega do projeto em ${plural(dd,'dia')} (${fmtD(p.due)})`,go:{t:'project',id:p.id}});
    }
  }
  if(P.goals){
    for(const g of S.goals){
      if(!goalOpen(g)||!g.due)continue;const dd=diffDays(td,g.due);
      if(dd<0)L.push({key:`glate:${g.id}:${g.due}`,kind:'late',at:dt(g.due,'23:59').getTime(),title:g.name,text:`Prazo da meta encerrado com ${goalPct(g)}% atingido`,go:{t:'goal',id:g.id}});
      else if(dd<=(+P.goalDays||0))L.push({key:`gdue:${g.id}:${g.due}`,kind:'goal',at:dt(addDays(g.due,-(+P.goalDays||0)),'08:00').getTime(),title:g.name,text:`Meta com prazo ${dd===0?'hoje':'em '+plural(dd,'dia')} · ${goalPct(g)}% atingido`,go:{t:'goal',id:g.id}});
    }
  }
  if(P.reminders){
    for(const r of S.reminders){
      if(r.done)continue;const st=dt(r.date,r.time||'08:00').getTime();
      if(st<=ts)L.push({key:`rem:${r.id}:${r.date}${r.time||''}`,kind:'reminder',at:st,title:r.title,text:`Lembrete · ${relDay(r.date)}${r.time?' às '+r.time:''}`,go:{t:'reminder',id:r.id}});
    }
  }
  if(P.bills&&S.fin){const lim=addDays(td,2);for(const mm of [ymAdd(td.slice(0,7),-1),td.slice(0,7),ymAdd(td.slice(0,7),1)])for(const x of finItems(mm)){if(x.e.type!=='despesa'||x.paid||x.date>lim)continue;const late=x.date<td;L.push({key:`fin:${x.key}`,kind:late?'late':'bill',at:dt(late?x.date:addDays(x.date,-2),'08:00').getTime(),title:x.e.desc,text:`${late?'Conta atrasada':'Conta a vencer'} · ${brl(x.amount)} · vencimento ${relDay(x.date).toLowerCase()}`,go:{t:'fin',id:x.key}});}}
  return L.filter(x=>!S.notif.dismissed[x.key]).sort((a,b)=>b.at-a.at);
}
const NIC={bill:'wallet',event:'calendar',late:'alert',task:'tasks',project:'briefcase',goal:'target',reminder:'bell'};
function notifPanel(){

function parseQDate(q){
  const m=q.trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);if(!m)return null;
  let y=m[3]?+m[3]:+today().slice(0,4);if(y<100)y+=2000;
  const d=`${y}-${pad(+m[2])}-${pad(+m[1])}`;
  return isDate(d)&&parseD(d).getDate()===+m[1]?d:null;
}
function searchAll(q){
  const n=norm(q).trim();if(n.length<2)return null;
  const qd=parseQDate(q);const has=(...xs)=>xs.some(x=>norm(x).includes(n));const R=[];
  if(qd)R.push({g:'Datas',ic:'calendar',t:`Abrir ${fmtD(qd)} na agenda`,s:cap(DIAS[wd(qd)]),a:'date',id:qd});
  for(const e of S.events)if(has(e.title,e.desc,e.location,e.participants,e.notes,catLabel(e.categoryId,e.categoryOther))||(qd&&occDates(e,qd,qd).length))R.push({g:'Compromissos',ic:'calendar',t:e.title,s:`${fmtD(qd&&occDates(e,qd,qd).length?qd:e.date)}${e.start?' · '+e.start:''}${isRec(e)?' · '+recText(e).toLowerCase():''}`,a:'occ',id:e.id+'@'+(qd&&occDates(e,qd,qd).length?qd:e.date)});
  for(const t of S.tasks)if(has(t.title,t.desc,t.notes,t.assignee,TST[t.status],catLabel(t.categoryId,t.categoryOther),PRI[t.priority]?.l,(t.subtasks||[]).map(s=>s.title).join(' '))||(qd&&(t.due===qd||t.plannedDate===qd)))R.push({g:'Tarefas',ic:'tasks',t:t.title,s:`${TST[t.status]}${t.due?' · prazo '+fmtD(t.due):''}`,a:'task',id:t.id});
  for(const p of S.projects)if(has(p.name,p.desc,p.objective,p.owner,PST[p.status],catLabel(p.categoryId,p.categoryOther))||(qd&&p.due===qd))R.push({g:'Projetos',ic:'briefcase',t:p.name,s:`${PST[p.status]} · ${projStats(p).pct}%`,a:'project',id:p.id});
  for(const g of S.goals)if(has(g.name,g.desc,g.unit,GPER[g.period],catLabel(g.categoryId,g.categoryOther))||(qd&&g.due===qd))R.push({g:'Metas',ic:'target',t:g.name,s:`${GPER[g.period]||''} · ${goalPct(g)}%`,a:'goal',id:g.id});
  for(const x of S.notes)if(has(x.title,x.content,catLabel(x.categoryId,x.categoryOther)))R.push({g:'Anotações',ic:'note',t:x.title||'(sem título)',s:(x.content||'').slice(0,70),a:'note',id:x.id});
  for(const l of S.lists){const it=(l.items||[]).find(i=>norm(i.text).includes(n));if(has(l.name)||it)R.push({g:'Listas',ic:'bag',t:l.name,s:it?`Item: ${it.text}`:`${(l.items||[]).filter(i=>!i.done).length} pendentes`,a:'list',id:l.id});}
  for(const e of S.fin.entries)if(has(e.desc,e.notes,finCat(e.type,e.category).name)){const m=e.recurring==='mensal'?(today().slice(0,7)>=e.date.slice(0,7)?today().slice(0,7):e.date.slice(0,7)):e.date.slice(0,7);R.push({g:'Financeiro',ic:'wallet',t:e.desc,s:`${e.type==='receita'?'Receita':'Conta'} · ${brl(e.amount)}${e.recurring==='mensal'?' · mensal':' · '+fmtD(e.date)}`,a:'fin',id:e.id+'@'+m});}
  for(const r of S.reminders)if(has(r.title,r.notes)||(qd&&r.date===qd))R.push({g:'Lembretes',ic:'bell',t:r.title,s:`${fmtD(r.date)}${r.time?' às '+r.time:''}`,a:'reminder',id:r.id});
  return R.slice(0,60);
}

/* ---------- Sincronização na nuvem (Supabase) ---------- */
const SUPABASE_URL='https://sxoubhtyeusogsvxxkou.supabase.co';
const SUPABASE_KEY='sb_publishable_PLkKsiZy5y-oHXKMlSnLLg_9lmmtXpX';
const SYNC_TABLE='planner_store';
const Sync={
  sb:null,user:null,state:'off',timer:null,lastError:'',busy:false,lastSync:0,
  init(){
    if(!window.supabase||!window.supabase.createClient){this.state='unavailable';return;}
    try{this.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,storageKey:'planner-priscila-auth',autoRefreshToken:true}});}catch(e){this.state='unavailable';return;}
    this.sb.auth.getSession().then(({data})=>{this.user=data&&data.session?data.session.user:null;if(this.user)this.pull();if(U.route==='config')render();});
    this.sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;const changed=(u&&u.id)!==(this.user&&this.user.id);this.user=u;if(changed&&U.route==='config')render();if(!u)setSaveState('ok');});
    setInterval(()=>{if(this.user&&!document.hidden)this.pull();},60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&this.user)this.pull();});
    window.addEventListener('online',()=>{if(this.user)this.pull();});
  },
  set(st,err){this.state=st;if(err!==undefined)this.lastError=err;if(!saveFailed)setSaveState(st==='ok'?'synced':st==='error'?'offline':st);if(U.route==='config'){const b=$('#syncStatus');if(b)b.innerHTML=syncStatusHTML();}},
  fail(error){
    const msg=String(error&&(error.message||error))||'Erro desconhecido';
    let nice=msg;
    if(/planner_store|relation|does not exist|schema cache|42P01|PGRST205/i.test(msg+(error&&error.code||'')))nice='A tabela “planner_store” ainda não existe no Supabase. Execute o arquivo supabase_planner_schema.sql no SQL Editor do projeto.';
    else if(/fetch|network|Failed/i.test(msg))nice='Sem conexão com a nuvem. As alterações continuam salvas neste dispositivo e serão enviadas depois.';
    this.set('error',nice);
  },
  schedule(){if(!this.user)return;clearTimeout(this.timer);this.set('pending');this.timer=setTimeout(()=>this.push(),1500);},
  async login(email,password){
    if(!this.sb)throw new Error('Serviço de sincronização indisponível (sem conexão com a internet?).');
    const {error}=await this.sb.auth.signInWithPassword({email,password});
    if(error)throw new Error(/Invalid login/i.test(error.message)?'E-mail ou senha incorretos.':error.message);
    const {data}=await this.sb.auth.getUser();this.user=data.user;
    await this.pull(true);
  },
  async logout(){if(this.sb)await this.sb.auth.signOut();this.user=null;this.state='off';setSaveState('ok');},
  async push(){
    if(!this.user)return;
    if(this.busy){this.schedule();return;}
    this.busy=true;this.set('pending');
    const ts=S.meta.updatedAt||Date.now();
    try{
      const payload=clone(S);
      const {error}=await this.sb.from(SYNC_TABLE).upsert({user_id:this.user.id,data:payload,updated_at:new Date(ts).toISOString()});
      if(error)throw error;
      S.meta.syncedAt=ts;this.lastSync=Date.now();persist();this.set('ok','');
    }catch(e){this.fail(e);}
    finally{this.busy=false;}
  },
  async pull(manual){
    if(!this.user||this.busy)return;
    this.busy=true;
    try{
      const {data,error}=await this.sb.from(SYNC_TABLE).select('data,updated_at').eq('user_id',this.user.id).maybeSingle();
      if(error)throw error;
      this.busy=false;
      if(!data){await this.push();return;}
      const remoteTs=Date.parse(data.updated_at);
      const localDirty=S.meta.updatedAt>S.meta.syncedAt;
      if(remoteTs<=S.meta.syncedAt){this.lastSync=Date.now();if(localDirty)await this.push();else this.set('ok','');return;}
      if(localDirty&&hasData(S)&&S.meta.syncedAt!==remoteTs){
        const ch=await choiceDlg(`Existem alterações na nuvem (salvas em ${new Date(remoteTs).toLocaleString('pt-BR')}) e também alterações neste dispositivo que ainda não foram enviadas. Qual versão deseja manter?`,
          [{v:'remote',l:'Usar os dados da nuvem',cls:'btn-primary'},{v:'local',l:'Manter os dados deste dispositivo'}],'Sincronização');
        if(ch!=='remote'){S.meta.updatedAt=Date.now();persist();await this.push();return;}
      }
      S=normalizeState(data.data);S.meta.updatedAt=remoteTs;S.meta.syncedAt=remoteTs;
      await persist(true);this.lastSync=Date.now();this.set('ok','');
      renderTopbar();render();if(manual)toast('Dados sincronizados com a nuvem.');
    }catch(e){this.busy=false;this.fail(e);}
  }
};
function syncStatusHTML(){
  if(Sync.state==='unavailable')return `<p class="small muted">${ic('alert',14)} Biblioteca de sincronização não carregou (verifique a conexão com a internet). Seus dados continuam salvos neste dispositivo.</p>`;
  if(!Sync.user)return `<p class="small muted">Sincronização desativada — os dados ficam salvos apenas neste navegador.</p>`;
  const st={ok:'Sincronizado',pending:'Enviando alterações…',error:'Falha na sincronização',off:'Conectando…'}[Sync.state]||Sync.state;
  return `<p class="small"><b>${st}</b>${Sync.lastSync?` · última verificação às ${new Date(Sync.lastSync).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:''}</p>${Sync.lastError?`<p class="small" style="color:var(--danger)">${esc(Sync.lastError)}</p>`:''}`;
}

function ring(p,size=96,label='',color='var(--rose)'){
  const r=size/2-7,c=2*Math.PI*r,o=c*(1-clamp(p,0,100)/100);
  return `<div class="ring"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)} ${p}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--beige)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${o.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .5s"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ring-val" font-size="${Math.round(size*.26)}">${p}%</text></svg>${label?`<small>${label}</small>`:''}</div>`;
}
function hBars(items,{unit=''}={}){
  if(!items.length)return `<div class="empty sm">Sem dados para exibir.</div>`;
  const tot=items.reduce((s,x)=>s+x.value,0)||1;const max=Math.max(...items.map(x=>x.value),1);
  return `<div class="hbars">${items.map(x=>`<div class="hbar" style="--c:${x.color}"><span title="${esc(x.label)}"><i></i>${esc(x.label)}</span><div class="track"><i style="--p:${x.value/max*100}%"></i></div><b>${x.value}${unit} <small class="muted">${pctOf(x.value,tot)}%</small></b></div>`).join('')}</div>`;
}
function barChart(labels,series,{h=200,minW=0}={}){
  const all=series.flatMap(s=>s.values);const max=Math.max(1,...all);
  const n=labels.length;const W=Math.max(minW,320,n*(series.length*11+12)+40);const top=12,bot=26,left=30;const ch=h-top-bot;const gw=(W-left)/n;const bw=Math.min(24,(gw-6)/series.length);
  const nice=Math.ceil(max/4)||1;const ymax=nice*4;
  let g='';for(let i=0;i<=4;i++){const y=top+ch-(i/4)*ch;g+=`<line class="gl" x1="${left}" x2="${W}" y1="${y}" y2="${y}"/><text x="${left-6}" y="${y+4}" text-anchor="end">${nice*i}</text>`;}
  const step=n>16?Math.ceil(n/12):1;
  let b='';labels.forEach((l,i)=>{
    const x0=left+i*gw+(gw-bw*series.length)/2;
    series.forEach((s,j)=>{const v=s.values[i]||0;const hh=v/ymax*ch;b+=`<rect x="${(x0+j*bw+1).toFixed(1)}" y="${(top+ch-hh).toFixed(1)}" width="${Math.max(2,bw-2).toFixed(1)}" height="${Math.max(0,hh).toFixed(1)}" rx="3" style="fill:${s.color}"><title>${esc(l)} · ${esc(s.name)}: ${v}</title></rect>`;});
    if(i%step===0)b+=`<text x="${(left+i*gw+gw/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${h}" style="min-width:${Math.min(W,minW||W)}px" role="img">${g}${b}</svg></div>${series.length>1?`<div class="legend" style="margin-top:8px">${series.map(s=>`<span style="--c:${s.color}"><i></i>${esc(s.name)}</span>`).join('')}</div>`:''}`;
}
function lineChart(points,{h=180,target=null,unit=''}={}){
  if(points.length<1)return `<div class="empty sm">Registre atualizações para ver a evolução.</div>`;
  const W=560,left=40,top=14,bot=26,right=14;const ch=h-top-bot,cw=W-left-right;
  const ys=points.map(p=>p.y).concat(target!=null?[target]:[]);let mn=Math.min(...ys,0),mx=Math.max(...ys);if(mx===mn)mx=mn+1;
  const X=i=>left+(points.length===1?cw/2:i/(points.length-1)*cw);const Y=v=>top+ch-(v-mn)/(mx-mn)*ch;
  let g='';for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3;g+=`<line class="gl" x1="${left}" x2="${W-right}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${left-6}" y="${Y(v)+4}" text-anchor="end">${fmtNum(Math.round(v*10)/10)}</text>`;}
  const path=points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area=`${path} L${X(points.length-1).toFixed(1)},${top+ch} L${X(0).toFixed(1)},${top+ch} Z`;
  const tl=target!=null?`<line x1="${left}" x2="${W-right}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--gold)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-right}" y="${Y(target)-6}" text-anchor="end" style="fill:var(--gold-text)">meta ${fmtNum(target)}${esc(unit)}</text>`:'';
  const dots=points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" style="fill:var(--card);stroke:var(--rose);stroke-width:2"><title>${esc(p.label)}: ${fmtNum(p.y)}${esc(unit)}</title></circle>`).join('');
  const step=Math.ceil(points.length/6);
  const labels=points.map((p,i)=>i%step===0||i===points.length-1?`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${esc(p.short||p.label)}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}<path d="${area}" style="fill:color-mix(in srgb,var(--rose) 10%,transparent)"/>${tl}<path d="${path}" fill="none" style="stroke:var(--rose)" stroke-width="2.2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function spark(vals,{w=200,h=42}={}){
  if(vals.length<2)return '';const mn=Math.min(...vals),mx=Math.max(...vals);const r=mx-mn||1;
  const p=vals.map((v,i)=>`${i?'L':'M'}${(i/(vals.length-1)*w).toFixed(1)},${(h-4-(v-mn)/r*(h-8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${p}" fill="none" style="stroke:var(--rose-2)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function dayItems(d){
  const occ=occOn(d);
  const items=[
    ...occ.map(o=>({kind:'ev',time:o.start,end:o.end,title:o.ev.title,sub:[o.end?`até ${o.end}`:'',o.ev.location].filter(Boolean).join(' · ')||'Compromisso',cat:o.ev.categoryId,pri:o.ev.priority,done:o.done,status:o.done?'Realizado':(d===today()&&o.end&&toMin(o.end)<nowMin()?'Encerrado':'Agendado'),id:o.key})),
    ...S.tasks.filter(t=>t.status!=='cancelada'&&(t.due===d||t.plannedDate===d)).map(t=>({kind:'task',time:t.due===d?(t.dueTime||''):'',title:t.title,sub:'Tarefa'+(t.projectId&&projOf(t.projectId)?' · '+projOf(t.projectId).name:''),cat:t.categoryId,pri:t.priority,done:t.status==='concluida',status:isLate(t)?'Atrasada':TST[t.status],id:t.id,late:isLate(t)})),
    ...S.reminders.filter(r=>r.date===d).map(r=>({kind:'rem',time:r.time||'',title:r.title,sub:'Lembrete',cat:'',pri:'',done:!!r.done,status:r.done?'Concluído':'Lembrete',id:r.id}))
  ];
  return items.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title));
}
const TOGGLE_ACT={ev:'occToggle',task:'taskToggle',rem:'remToggle'};
const OPEN_ACT={ev:'occ',task:'task',rem:'reminder'};
function routineRows(items,showNow){
  const nm=nowMin();let nowShown=!showNow;
  return items.map(x=>{
    let pre='';
    if(!nowShown&&x.time&&toMin(x.time)>nm){pre=`<div class="rt-now">Agora · ${fromMin(nm)}</div>`;nowShown=true;}
    return pre+`<div class="rt-row ${x.done?'done':''}"><button class="tick ${x.done?'on':''}" data-a="${TOGGLE_ACT[x.kind]}" data-id="${x.id}" aria-label="${x.done?'Desmarcar':'Marcar como concluído'}">${ic('check',14)}</button>
      <span class="rt-time">${x.time||'—'}</span>
      <button class="rt-title" data-a="openRef" data-type="${OPEN_ACT[x.kind]}" data-id="${x.id}"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></button>
      <span class="rt-cat">${x.cat?catChip(x.cat):''}</span><span class="rt-pri">${priPill(x.pri)}</span>
      <span class="rt-st">${x.late?'<span class="badge-late">Atrasada</span>':esc(x.status)}</span></div>`;
  }).join('')+(!nowShown&&items.length?`<div class="rt-now">Agora · ${fromMin(nm)}</div>`:'');
}
function periodProgress(a,b){
  const occ=occList(a,b);const tk=S.tasks.filter(t=>t.status!=='cancelada'&&taskDay(t)>=a&&taskDay(t)<=b);
  const total=occ.length+tk.length,done=occ.filter(o=>o.done).length+tk.filter(t=>t.status==='concluida').length;
  return {total,done,pct:pctOf(done,total)};
}
VIEWS.dashboard=()=>{
  const n=nowTZ(),td=iso(n),h=n.getHours();
  const greet=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const evT=occOn(td);
  const open=S.tasks.filter(isOpen),done=S.tasks.filter(t=>t.status==='concluida'),late=open.filter(isLate);
  const doneToday=done.filter(t=>(t.completedAt||'').startsWith(td)).length;
  const dl=deadlines(td,addDays(td,7));
  const pa=S.projects.filter(p=>p.status==='em_andamento');
  const ga=S.goals.filter(goalOpen);
  const motiv=S.settings.showMotivation?MOTIV[((diffDays('2024-01-01',td))%MOTIV.length+MOTIV.length)%MOTIV.length]:'';
  const kpis=[
    ['calendar','Compromissos de hoje',evT.length,`${evT.filter(o=>o.done).length} realizado(s)`,'kAgenda',''],
    ['tasks','Tarefas pendentes',open.length,`${open.filter(t=>t.due===td).length} com prazo hoje`,'kOpen',''],
    ['check','Tarefas concluídas',done.length,`${doneToday} concluída(s) hoje`,'kDone',''],
    ['alert','Tarefas atrasadas',late.length,late.length?'requerem atenção':'tudo em dia','kLate',late.length?'warn':''],
    ['flag','Próximos prazos',dl.length,'nos próximos 7 dias','kDeadl','gold'],
    ['briefcase','Projetos em andamento',pa.length,`${S.projects.filter(projOpen).length} ativo(s) no total`,'kProj',''],
    ['target','Metas em acompanhamento',ga.length,ga.length?`progresso médio ${Math.round(ga.reduce((s,g)=>s+goalPct(g),0)/ga.length)}%`:'nenhuma ativa','kGoal','gold']
  ];
  const items=dayItems(td);
  const wds=weekDays(td);
  const wstats=wds.map(d=>{const occ=occOn(d);const tk=S.tasks.filter(t=>t.status!=='cancelada'&&taskDay(t)===d);return {d,total:occ.length+tk.length,done:occ.filter(o=>o.done).length+tk.filter(t=>t.status==='concluida').length};});
  const wmax=Math.max(1,...wstats.map(w=>w.total));
  const allT=S.tasks.filter(t=>t.status!=='cancelada');
  const wp=periodProgress(wds[0],wds[6]);const mp=periodProgress(monthStart(td),monthEnd(td));
  const cats={};
  occList(monthStart(td),monthEnd(td)).forEach(o=>{const k=o.ev.categoryId||'';cats[k]=(cats[k]||0)+1;});
  S.tasks.filter(t=>t.status!=='cancelada'&&((taskDay(t)>=monthStart(td)&&taskDay(t)<=monthEnd(td))||(isOpen(t)&&!taskDay(t)))).forEach(t=>{const k=t.categoryId||'';cats[k]=(cats[k]||0)+1;});
  const catItems=Object.entries(cats).map(([k,v])=>({label:catOf(k).name,color:catOf(k).color,value:v})).sort((a,b)=>b.value-a.value);
  return `
  <section class="hero">
    <div style="position:relative;z-index:1">
      <div class="eyebrow">${greet} · Agenda</div>
      <h1>${esc(S.settings.name||'Meu planner')}</h1>
      <div class="date">${cap(DIAS[n.getDay()])}, ${fmtLong(td)}</div>
      ${motiv?`<div class="motiv">“${esc(motiv)}”</div>`:''}
    </div>
    <div class="ph-actions"><button class="btn btn-ghost" data-a="newEvent" data-date="${td}">${ic('calendar',16)}Novo compromisso</button><button class="btn btn-primary" data-a="newTask" data-due="${td}">${ic('plus',16)}Nova tarefa</button></div>
  </section>
  <div class="kpis">${kpis.map(([i,l,v,s,a,c])=>`<button class="kpi ${c}" data-a="${a}"><span class="k-ic">${ic(i,18)}</span><b>${v}</b><span>${l}</span><small>${s}</small></button>`).join('')}</div>
  <div class="grid g-main">
    <div class="stack">
      <section class="card">
        <div class="card-h"><h3>${ic('clock',19)}Minha rotina de hoje</h3><div class="row"><span class="sub">${items.filter(x=>x.done).length} de ${items.length} concluídos</span><button class="btn btn-ghost btn-sm" data-a="go" data-r="agenda">Abrir agenda</button></div></div>
        ${items.length?`<div class="rt-list">${routineRows(items,true)}</div>`:`<div class="empty">${ic('feather',30)}<b>Dia livre por enquanto</b>Nenhum compromisso, tarefa ou lembrete para hoje.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn btn-ghost btn-sm" data-a="newEvent" data-date="${td}">Adicionar compromisso</button><button class="btn btn-ghost btn-sm" data-a="newTask" data-due="${td}">Adicionar tarefa</button></div></div>`}
      </section>
      <section class="card">
        <div class="card-h"><h3>${ic('week',19)}Visão da semana</h3><span class="sub">${weekTitle(wds)}</span></div>
        <div class="wk-bars">${wstats.map(w=>`<button class="wk-bar ${w.d===td?'today':''}" data-a="agDay" data-date="${w.d}" title="${w.done} de ${w.total} concluídos"><b>${w.done}/${w.total}</b><div class="bar"><i style="height:${w.total/wmax*100}%"></i><em style="height:${w.done/wmax*100}%"></em></div><small>${DIAS_C[wd(w.d)]} ${+w.d.slice(8)}</small></button>`).join('')}</div>
        <div class="legend" style="margin-top:10px"><span style="--c:var(--nude)"><i></i>Programados</span><span style="--c:var(--rose)"><i></i>Concluídos</span></div>
      </section>
    </div>
    <div class="stack">
      <section class="card">
        <div class="card-h"><h3>${ic('trend',19)}Indicadores</h3></div>
        <div class="rings">${ring(pctOf(done.length,allT.length),92,'Tarefas concluídas')}${ring(wp.pct,92,'Progresso semanal','var(--gold)')}${ring(mp.pct,92,'Progresso mensal','var(--rose-2)')}</div>
        <div class="gold-line"></div>
        <h4 style="margin-bottom:10px">Atividades por categoria <small class="muted" style="font-family:var(--ff);font-size:12px">· ${MESES[n.getMonth()]}</small></h4>
        ${hBars(catItems)}
      </section>
      <section class="card">
        <div class="card-h"><h3>${ic('flag',19)}Próximos prazos</h3><span class="sub">7 dias</span></div>
        ${dlList(deadlines(td,addDays(td,7),{late:true}).slice(0,8),'Nenhum prazo nos próximos 7 dias.')}
      </section>
      ${pa.length?`<section class="card"><div class="card-h"><h3>${ic('briefcase',19)}Projetos em andamento</h3><button class="link" data-a="go" data-r="projetos">Ver todos</button></div>${pa.slice(0,4).map(p=>{const s=projStats(p);return `<button class="mini-it" data-a="openRef" data-type="project" data-id="${p.id}"><i class="c" style="--c:${catOf(p.categoryId).color}"></i><b>${esc(p.name)}</b><span style="width:110px">${prog(s.pct)}</span><small class="muted">${s.pct}%</small></button>`;}).join('')}</section>`:''}
    </div>
  </div>`;
};

const HH=48;
const agFilter=()=>U.ag.cat?(ev=>ev.categoryId===U.ag.cat):null;
const tasksDue=d=>S.tasks.filter(t=>t.due===d&&t.status!=='cancelada'&&(!U.ag.cat||t.categoryId===U.ag.cat||U.route!=='agenda'));
const evChip=o=>`<div class="ev-chip ${o.done?'done':''}" style="--c:${o.color}" data-drag="ev:${o.key}" data-a="openRef" data-type="occ" data-id="${o.key}" title="${esc(o.ev.title)}${o.start?' · '+o.start:''}">${o.start?`<i>${o.start}</i> `:''}${esc(o.ev.title)}</div>`;
const taskChip=(t,drag)=>`<div class="tk-chip ${t.status==='concluida'?'done':''} ${isLate(t)?'late':''}" ${drag?`data-drag="task:${t.id}"`:''} data-a="openRef" data-type="task" data-id="${t.id}" title="Tarefa: ${esc(t.title)}">${ic('check',11)}${t.dueTime?`<i style="font-style:normal">${t.dueTime}</i>`:''}<span style="overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</span></div>`;
const weekHeader=()=>[0,1,2,3,4,5,6].map(i=>`<span>${DIAS_C[(+S.settings.weekStart+i)%7]}</span>`).join('');
function monthCells(d){const first=monthStart(d);const start=weekStart(first);const cells=Array.from({length:42},(_,i)=>addDays(start,i));return ym(cells[35])!==ym(d)?cells.slice(0,35):cells;}
function catLegend(){return S.categories.map(c=>`<span style="--c:${c.color}"><i></i>${esc(c.name)}</span>`).join('');}

function layoutDay(items){
  const ev=items.map(o=>{const s=toMin(o.start);let e=toMin(o.end);if(e==null||e<=s)e=s+60;return {o,s,e:Math.max(e,s+20)};}).sort((a,b)=>a.s-b.s||b.e-a.e);
  const out=[];let cl=[],cEnd=-1;
  const flush=()=>{const lanes=[];for(const x of cl){let i=lanes.findIndex(end=>end<=x.s);if(i<0){i=lanes.length;lanes.push(0);}lanes[i]=x.e;x.lane=i;}for(const x of cl)x.n=lanes.length;out.push(...cl);cl=[];};
  for(const x of ev){if(cl.length&&x.s>=cEnd){flush();cEnd=-1;}cl.push(x);cEnd=Math.max(cEnd,x.e);}
  flush();return out;
}
function evBlock(x){
  const o=x.o;const top=x.s/60*HH,h=Math.max((x.e-x.s)/60*HH-2,18);const w=100/x.n;
  return `<div class="ev-block ${o.done?'done':''} ${h<36?'short':''}" style="top:${top}px;height:${h}px;left:calc(${x.lane*w}% + 2px);width:calc(${w}% - 4px);--c:${o.color}" data-drag="ev:${o.key}" data-a="openRef" data-type="occ" data-id="${o.key}" title="${esc(o.ev.title)} · ${o.start}${o.end?'–'+o.end:''}"><b>${esc(o.ev.title)}</b><small>${o.start}${o.end?'–'+o.end:''}${o.ev.location?' · '+esc(o.ev.location):''}</small>${o.rec?`<span class="rec">${ic('repeat',11)}</span>`:''}</div>`;
}
function timeGrid(dates){
  const td=today(),nm=nowMin(),f=agFilter();
  const cols=dates.map(d=>{const occ=occList(d,d,f);return {d,timed:occ.filter(o=>o.start),allday:occ.filter(o=>!o.start)};});
  const n=dates.length;
  return `<div class="tg ${n===1?'tg-day':''}"><div class="tg-wrap"><div class="tg-inner">
    <div class="tg-row tg-head" style="--n:${n}"><div class="tg-gut"></div>${cols.map(c=>{const hs=holOn(c.d);return `<button class="tg-dh ${c.d===td?'today':''}" data-a="agDay" data-date="${c.d}" title="Ver o dia"><span>${DIAS_C[wd(c.d)]}</span><b>${+c.d.slice(8)}</b>${hs.length?`<small class="hol" title="${esc(hs.map(x=>x.name).join(', '))}">${esc(hs[0].name)}</small>`:''}</button>`;}).join('')}</div>
    <div class="tg-row tg-allday" style="--n:${n}"><div class="tg-gut">dia<br>todo</div>${cols.map(c=>`<div class="tg-ad" data-drop="day:${c.d}">${c.allday.map(evChip).join('')}${tasksDue(c.d).map(t=>taskChip(t)).join('')}</div>`).join('')}</div>
    <div class="tg-scroll" id="tgScroll" data-keep-scroll><div class="tg-body" style="--n:${n}">
      <div class="tg-hours">${Array.from({length:24},(_,h)=>`<div class="tg-h"><span>${pad(h)}:00</span></div>`).join('')}</div>
      ${cols.map(c=>`<div class="tg-col ${c.d===td?'today':''}" data-drop="col:${c.d}" data-a="gridNew" data-date="${c.d}" title="Clique para criar um compromisso">${layoutDay(c.timed).map(evBlock).join('')}${c.d===td?`<div class="now-line" style="top:${nm/60*HH}px"><i></i></div>`:''}</div>`).join('')}
    </div></div>
  </div></div></div>`;
}
function monthGrid(d){
  const td=today(),m=ym(d);const cells=monthCells(d);const f=agFilter();
  const by={};occList(cells[0],cells[cells.length-1],f).forEach(o=>(by[o.date]||(by[o.date]=[])).push(o));
  return `<div class="mg"><div class="mg-title">${monthName(d)}</div><div class="mg-head">${weekHeader()}</div><div class="mg-grid">${cells.map(c=>{
    const L=by[c]||[];const tks=tasksDue(c);const hs=holOn(c);const tot=L.length+tks.length;

/* ---------- Ações sobre compromissos ---------- */
A.occToggle=el=>{

  commit(()=>{
    if(o.rec){const s=new Set(o.ev.doneDates||[]);s.has(o.date)?s.delete(o.date):s.add(o.date);o.ev.doneDates=[...s];}
    else o.ev.done=!o.ev.done;
  },{msg:o.done?'Compromisso reaberto':'Compromisso marcado como realizado'});

};
function refreshDayModal(){if(DAYM&&DAYM.el.isConnected){const dl=$('#dayList',DAYM.el);if(dl)dl.innerHTML=routineRows(dayItems(DAYM.d),DAYM.d===today());}}
function conflicts(dr,excl=()=>false){
  if(!dr.start)return [];
  const s1=toMin(dr.start);let e1=toMin(dr.end);if(e1==null||e1<=s1)e1=s1+60;
  const dates=occDates({...dr,skip:dr.skip||[]},dr.date,addDays(dr.date,isRec(dr)?120:0)).slice(0,80);
  const out=[];const seen=new Set();
  for(const d of dates){
    for(const o of occOn(d)){
      if(o.ev.id===dr.id||excl(o)||!o.start)continue;
      const s2=toMin(o.start);let e2=toMin(o.end);if(e2==null||e2<=s2)e2=s2+60;
      if(s1<e2&&s2<e1&&!seen.has(o.key)){seen.add(o.key);out.push(o);}
    }
    if(out.length>=6)break;
  }
  return out;
}
const conflictMsg=cf=>`Este horário conflita com ${cf.length===1?'o compromisso':'os compromissos'}:<br><br>${cf.map(o=>`• <b>${esc(o.ev.title)}</b> — ${fmtD(o.date)}, ${o.start}${o.end?'–'+o.end:''}`).join('<br>')}<br><br>Deseja salvar mesmo assim?`;
async function moveOcc(key,nd,ns){
  const o=occByKey(key);if(!o)return;const ev=o.ev;
  const newStart=ns!==undefined?ns:o.start;
  if(nd===o.date&&newStart===o.start)return;
  let dur=60;if(o.start&&o.end&&toMin(o.end)>toMin(o.start))dur=toMin(o.end)-toMin(o.start);
  const newEnd=newStart?(o.end||ns!==undefined?fromMin(Math.min(toMin(newStart)+dur,1439)):''):'';
  let mode='single';
  if(o.rec){mode=await choiceDlg(`“${esc(ev.title)}” se repete. O que deseja mover para ${fmtD(nd)}${newStart?' às '+newStart:''}?`,[{v:'one',l:'Somente esta ocorrência',cls:'btn-primary'},{v:'all',l:'Toda a série'}],'Compromisso recorrente');if(!mode){render();return;}}
  const delta=diffDays(o.date,nd);
  let draft;
  if(mode==='one')draft={...clone(ev),id:uid(),date:nd,start:newStart,end:newEnd,recurrence:{type:'none'},done:o.done,doneDates:[],skip:[]};
  else if(mode==='all'){draft={...clone(ev),date:addDays(ev.date,delta),start:newStart,end:newStart?newEnd:ev.end};if(draft.recurrence&&draft.recurrence.weekdays&&draft.recurrence.weekdays.length)draft.recurrence.weekdays=draft.recurrence.weekdays.map(w=>((+w+delta)%7+7)%7);if(draft.recurrence&&draft.recurrence.until)draft.recurrence.until=addDays(draft.recurrence.until,delta);}
  else draft={...clone(ev),date:nd,start:newStart,end:newEnd};
  const cf=conflicts(draft,x=>x.key===key||x.ev.id===ev.id);
  if(cf.length&&!(await confirmDlg(conflictMsg(cf),{ok:'Mover mesmo assim',title:'Conflito de horário'}))){render();return;}
  commit(s=>{
    if(mode==='one'){ev.skip=[...(ev.skip||[]),o.date];ev.doneDates=(ev.doneDates||[]).filter(x=>x!==o.date);s.events.push(draft);}
    else Object.assign(ev,{date:draft.date,start:draft.start,end:draft.end,recurrence:draft.recurrence});
  },{msg:`Compromisso reagendado para ${fmtD(nd)}${newStart?' às '+newStart:''}`});
}
async function deleteOcc(key){
  const o=occByKey(key);if(!o)return false;
  if(o.rec){
    const ch=await choiceDlg(`Excluir “${esc(o.ev.title)}”?`,[{v:'one',l:`Somente a ocorrência de ${fmtD(o.date)}`},{v:'all',l:'Toda a série (todas as ocorrências)',cls:'btn-danger'}],'Excluir compromisso recorrente');
    if(!ch)return false;
    if(ch==='one'){commit(()=>{o.ev.skip=[...(o.ev.skip||[]),o.date];},{msg:'Ocorrência excluída'});return true;}
    if(!(await confirmDlg('Todas as ocorrências desta série serão excluídas. Esta ação não pode ser desfeita.',{ok:'Excluir série',danger:true})))return false;
  }else if(!(await confirmDlg(`Excluir o compromisso “${esc(o.ev.title)}”? Esta ação não pode ser desfeita.`,{ok:'Excluir',danger:true,title:'Excluir compromisso'})))return false;
  commit(s=>{s.events=s.events.filter(e=>e.id!==o.ev.id);},{msg:'Compromisso excluído'});
  return true;
}

  const wds=(r.weekdays&&r.weekdays.length?r.weekdays:[wd(date||today())]).map(Number);
  const order=[0,1,2,3,4,5,6].map(i=>(+S.settings.weekStart+i)%7);

  ${showW?`<div class="wd-pick" aria-label="Dias da semana">${order.map(i=>`<label class="wd"><input type="checkbox" name="recWd[]" value="${i}" ${wds.includes(i)?'checked':''}><span>${DIAS_C[i]}</span></label>`).join('')}</div>`:''}
  ${t!=='none'?`<div class="grid2">${F.text('recUntil','Repetir até (opcional)',r.until||'',{type:'date'})}<div class="fld"><span>&nbsp;</span><small class="hint" style="padding-top:10px">Sem data final, o compromisso se repete indefinidamente.</small></div></div>`:''}`;
}

CH.recUnit=el=>{const f=el.form;$('#recBox',f).innerHTML=recBox({type:'custom',unit:el.value,interval:f.recInterval.value,weekdays:[wd(f.date.value||today())],until:f.recUntil?f.recUntil.value:''},f.date.value);};

      const r={type:d.recType||'none'};
      if(r.type!=='none'){
        if(r.type==='custom'){r.interval=Math.max(1,parseInt(d.recInterval)||1);r.unit=d.recUnit||'day';}
        if(d.recWd&&d.recWd.length)r.weekdays=d.recWd.map(Number);
        if(d.recUntil){if(d.recUntil<d.date)return fieldErr(f,'recUntil','A data final da repetição deve ser depois da data inicial.');r.until=d.recUntil;}
        if((r.type==='weekly'||r.type==='biweekly'||(r.type==='custom'&&r.unit==='week'))&&!(r.weekdays&&r.weekdays.length))return toast('Selecione ao menos um dia da semana para a repetição.','error'),false;
      }
      const out={...e,title:d.title,desc:d.desc,date:d.date,start:d.start,end:d.start?(d.end||fromMin(Math.min(toMin(d.start)+60,1439))):'',location:d.location,participants:d.participants,categoryId:d.categoryId,categoryOther:isOutros(d.categoryId)?d.categoryOther:'',priority:d.priority,
        color:d.useCatColor?'':d.color,notes:d.notes,reminders:[...new Set(reminders)].sort((a,b)=>a-b),recurrence:r,important:!!d.important,updatedAt:stamp()};
      if(isNew&&S.events.some(x=>norm(x.title)===norm(out.title)&&x.date===out.date&&(x.start||'')===(out.start||''))){
        if(!(await confirmDlg(`Já existe um compromisso “${esc(out.title)}” em ${fmtD(out.date)}${out.start?' às '+out.start:''}. Deseja cadastrar mesmo assim?`,{ok:'Cadastrar mesmo assim',title:'Possível duplicidade'})))return false;
      }
      const cf=conflicts(out);
      if(cf.length&&!(await confirmDlg(conflictMsg(cf),{ok:'Salvar mesmo assim',title:'Conflito de horário'})))return false;
      commit(s=>{if(isNew)s.events.push(out);else{const i=s.events.findIndex(x=>x.id===out.id);if(i>=0)s.events[i]=out;else s.events.push(out);}},{msg:isNew?'Compromisso cadastrado':'Compromisso atualizado'});
    }});
}
</script>
<script>
'use strict';
/* =====================================================================
   TAREFAS · PLANEJAMENTO SEMANAL · PLANEJAMENTO MENSAL
   ===================================================================== */
function formData(form){
  const o={};
  for(const el of form.elements){
    if(!el.name||el.disabled&&el.type!=='checkbox')continue;
    if(el.type==='checkbox'){
      if(el.name.endsWith('[]')){const k=el.name.slice(0,-2);(o[k]||(o[k]=[]));if(el.checked)o[k].push(el.value);}
      else o[el.name]=el.checked;
    }else if(el.type==='radio'){if(el.checked)o[el.name]=el.value;}
    else if(el.type!=='file'&&el.type!=='submit'&&el.type!=='button')o[el.name]=(el.value||'').trim();
  }
  return o;
}
const TASK_REM=[['','Sem lembrete'],['0','No horário do prazo'],['15','15 minutos antes'],['30','30 minutos antes'],['60','1 hora antes'],['1440','1 dia antes'],['custom','Personalizado…']];

function filterTasks({ignoreStatus=false}={}){
  const T=U.tk;const q=norm(T.q);
  return S.tasks.filter(t=>{
    if(!ignoreStatus){
      if(T.status==='abertas'&&!isOpen(t))return false;
      if(T.status==='atrasadas'&&!isLate(t))return false;
      if(TST[T.status]&&t.status!==T.status)return false;
    }
    if(T.pri&&t.priority!==T.pri)return false;
    if(T.cat&&t.categoryId!==T.cat)return false;
    if(T.proj&&(T.proj==='none'?t.projectId:t.projectId!==T.proj))return false;
    if(q&&!norm([t.title,t.desc,t.notes,t.assignee,(t.subtasks||[]).map(s=>s.title).join(' '),(t.checklist||[]).map(s=>s.title).join(' ')].join(' ')).includes(q))return false;
    return true;
  });
}
const sortTasks=L=>L.sort((a,b)=>(isOpen(b)-isOpen(a))||((a.due||'9999')+(a.dueTime||'99')).localeCompare((b.due||'9999')+(b.dueTime||'99'))||(PRI[b.priority]?.w||0)-(PRI[a.priority]?.w||0)||a.title.localeCompare(b.title));
function taskRow(t,o={}){
  const st=subProg(t);const late=isLate(t);const p=projOf(t.projectId);
  return `<div class="tk-row ${t.status==='concluida'?'done':''} ${t.status==='cancelada'?'cancel':''} ${late?'late':''}" ${o.drag?`data-drag="task:${t.id}"`:''}>
    <button class="tick ${t.status==='concluida'?'on':''}" data-a="taskToggle" data-id="${t.id}" aria-label="${t.status==='concluida'?'Reabrir tarefa':'Concluir tarefa'}" title="${t.status==='concluida'?'Reabrir':'Concluir'}">${ic('check',14)}</button>
    <button class="tk-main" data-a="openRef" data-type="task" data-id="${t.id}"><b>${esc(t.title)}</b><span class="meta">
      ${t.due?`<span class="${late?'late-t':''}">${ic('clock',12)}${relDay(t.due)}${t.dueTime?' '+t.dueTime:''}</span>`:''}
      ${o.done&&t.completedAt?`<span>${ic('check',12)}Concluída ${fmtStamp(t.completedAt)}</span>`:''}
      ${p?`<span>${ic('briefcase',12)}${esc(p.name)}</span>`:''}
      ${t.assignee?`<span>${ic('user',12)}${esc(t.assignee)}</span>`:''}${(t.attachments||[]).length?`<span>${ic('clip',12)}${t.attachments.length}</span>`:''}
      ${(t.links||[]).length?`<span>${ic('link',12)}${t.links.length}</span>`:''}${late?'<span class="badge-late">Atrasada</span>':''}</span></button>
    ${st?`<button class="sub-tog ${subAllDone(t)?'full':''}" data-a="tkSub" data-id="${t.id}" aria-expanded="${subOpen(t)}" title="${subOpen(t)?'Ocultar checklist':'Mostrar checklist'}">${ic('tasks',13)}${st}<span style="display:inline-block;transform:rotate(${subOpen(t)?180:0}deg)">${ic('chevD',12)}</span></button>`:''}
    <div class="tk-side">${t.categoryId?catChip(t.categoryId,t.categoryOther):''}${priPill(t.priority)}
      <select class="st-sel st-${t.status}" data-ch="taskStatus" data-id="${t.id}" aria-label="Status">${opts(Object.entries(TST),t.status)}</select>
      <button class="btn-icon sm" data-a="taskDup" data-id="${t.id}" title="Duplicar" aria-label="Duplicar">${ic('copy',15)}</button>
      <button class="btn-icon sm danger" data-a="taskDel" data-id="${t.id}" title="Excluir" aria-label="Excluir">${ic('trash',15)}</button></div>${st&&subOpen(t)?subList(t):''}</div>`;
}
const subItems=t=>[...(t.subtasks||[]),...(t.checklist||[])];
const subAllDone=t=>{const L=subItems(t);return L.length>0&&L.every(x=>x.done);};
const subOpen=t=>(U.tk.exp&&(t.id in U.tk.exp))?U.tk.exp[t.id]:isOpen(t);
function subList(t){
  const both=(t.subtasks||[]).length&&(t.checklist||[]).length;
  const grp=(k,label)=>(t[k]||[]).length?(both?`<div class="tk-sub-h">${label}</div>`:'')+t[k].map(s=>`<div class="ck ${s.done?'done':''}"><button class="tick sq ${s.done?'on':''}" data-a="subToggle" data-t="${t.id}" data-k="${k}" data-id="${s.id}" aria-label="${s.done?'Desmarcar':'Marcar'}: ${esc(s.title)}">${ic('check',11)}</button><span>${esc(s.title)}</span>${s.due?`<small class="${!s.done&&s.due<today()?'late-t':'muted'}">${fmtDS(s.due)}</small>`:''}</div>`).join(''):'';
  return `<div class="tk-sub">${grp('subtasks','Subtarefas')}${grp('checklist','Checklist')}</div>`;
}
A.tkSub=el=>{const t=byId(S.tasks,el.dataset.id);if(!t)return;U.tk.exp=U.tk.exp||{};U.tk.exp[t.id]=!subOpen(t);render();};
A.subToggle=el=>{
  const t=byId(S.tasks,el.dataset.t);const s=t&&(t[el.dataset.k]||[]).find(x=>x.id===el.dataset.id);if(!s)return;
  const willDone=!s.done;const complete=willDone&&subItems(t).filter(x=>x.done).length+1===subItems(t).length;
  commit(()=>{s.done=willDone;s.doneAt=willDone?stamp():'';},{msg:!willDone?'Item desmarcado':(complete&&isOpen(t)?'Checklist completo! Você já pode concluir a tarefa.':'Item concluído')});
};
const taskListHTML=(L,o)=>L.length?`<div class="tk-list">${L.map(t=>taskRow(t,o)).join('')}</div>`:'';
function groupHTML(groups,o){
  const g=groups.filter(x=>x.items.length);
  if(!g.length)return emptyTasks();
  return g.map(x=>`<div class="grp"><div class="grp-h">${x.color?`<i class="dot" style="--c:${x.color}"></i>`:''}${esc(x.label)}<em>${x.items.length}</em></div><div class="card" style="padding:4px 10px">${taskListHTML(sortTasks(x.items),o)}</div></div>`).join('');
}
const emptyTasks=()=>`<div class="card empty">${ic('tasks',30)}<b>Nenhuma tarefa encontrada</b>${S.tasks.length?'Ajuste os filtros ou a pesquisa.':'Cadastre a sua primeira tarefa para começar.'}<div style="margin-top:12px"><button class="btn btn-primary btn-sm" data-a="newTask">${ic('plus',15)}Nova tarefa</button></div></div>`;

VIEWS.tarefas=()=>{
  const T=U.tk;const open=S.tasks.filter(isOpen);const late=open.filter(isLate);
  const views=[['lista','Lista','list'],['kanban','Kanban','kanban'],['calendario','Calendário','calendar'],['categoria','Por categoria','palette'],['prioridade','Por prioridade','flag'],['prazo','Por prazo','clock'],['historico','Histórico','history']];
  let body='';const L=filterTasks();
  switch(T.view){
    case'lista':body=L.length?`<div class="card" style="padding:4px 12px">${taskListHTML(sortTasks(L))}</div>`:emptyTasks();break;
    case'kanban':body=kanbanTasks(filterTasks({ignoreStatus:true}));break;
    case'calendario':body=taskCalendar(filterTasks({ignoreStatus:true}));break;
    case'categoria':body=groupHTML([...S.categories.map(c=>({label:c.name,color:c.color,items:L.filter(t=>t.categoryId===c.id)})),{label:'Sem categoria',color:'#B5A7A3',items:L.filter(t=>!t.categoryId||!byId(S.categories,t.categoryId))}]);break;
    case'prioridade':body=groupHTML(['urgente','alta','media','baixa'].map(k=>({label:'Prioridade '+PRI[k].l.toLowerCase(),items:L.filter(t=>t.priority===k)})));break;
    case'prazo':{const td=today();const we=weekDays(td)[6];
      body=groupHTML([{label:'Atrasadas',color:'var(--danger)',items:L.filter(isLate)},{label:'Hoje',items:L.filter(t=>!isLate(t)&&t.due===td)},{label:'Amanhã',items:L.filter(t=>t.due===addDays(td,1))},
        {label:'Ainda nesta semana',items:L.filter(t=>t.due>addDays(td,1)&&t.due<=we)},{label:'Próximas semanas',items:L.filter(t=>t.due>we&&t.due<=addDays(td,30))},{label:'Mais adiante',items:L.filter(t=>t.due>addDays(td,30))},
        {label:'Sem prazo definido',items:L.filter(t=>!t.due)},{label:'Prazos já encerrados',items:L.filter(t=>!isOpen(t)&&t.due&&t.due<td)}]);break;}
    case'historico':body=taskHistory();break;
  }
  const showStatus=!['kanban','calendario','historico'].includes(T.view);
  return `<div class="page-h"><div><div class="eyebrow">Gerenciador</div><h1>Tarefas</h1><p class="sub">${plural(open.length,'pendente')} · ${late.length?`<span class="late-t">${plural(late.length,'atrasada')}</span>`:'nenhuma atrasada'} · ${plural(S.tasks.filter(t=>t.status==='concluida').length,'concluída')}</p></div>
    <div class="ph-actions"><button class="btn btn-primary" data-a="newTask">${ic('plus',16)}Nova tarefa</button></div></div>
  <div class="toolbar no-print"><div class="seg">${views.map(([k,l])=>`<button class="${T.view===k?'on':''}" data-a="tkView" data-v="${k}">${l}</button>`).join('')}</div></div>
  <div class="toolbar no-print">
    <div class="search-in">${ic('search',16)}<input type="search" id="tkQ" placeholder="Pesquisar tarefas…" value="${esc(T.q)}" data-in="tkQ" aria-label="Pesquisar tarefas"></div>
    ${showStatus?`<select data-ch="tkF" data-k="status" aria-label="Status"><option value="abertas" ${T.status==='abertas'?'selected':''}>Em aberto</option><option value="atrasadas" ${T.status==='atrasadas'?'selected':''}>Atrasadas</option><option value="todas" ${T.status==='todas'?'selected':''}>Todos os status</option>${opts(Object.entries(TST),T.status)}</select>`:''}
    ${T.view!=='historico'?`<select data-ch="tkF" data-k="pri" aria-label="Prioridade"><option value="">Todas as prioridades</option>${opts(F.priOpts(),T.pri)}</select>`:''}
    <select data-ch="tkF" data-k="cat" aria-label="Categoria"><option value="">Todas as categorias</option>${opts(S.categories.map(c=>[c.id,c.name]),T.cat)}</select>
    <select data-ch="tkF" data-k="proj" aria-label="Projeto"><option value="">Todos os projetos</option><option value="none" ${T.proj==='none'?'selected':''}>Sem projeto</option>${opts(S.projects.map(p=>[p.id,p.name]),T.proj)}</select>
    ${(T.q||T.pri||T.cat||T.proj||(showStatus&&T.status!=='abertas'))?`<button class="link" data-a="tkClear">Limpar filtros</button>`:''}
  </div>${body}`;
};
IN.tkQ=el=>{U.tk.q=el.value;render();};
CH.tkF=el=>{U.tk[el.dataset.k]=el.value;render();};
A.tkView=el=>{U.tk.view=el.dataset.v;render();};
A.tkClear=()=>{Object.assign(U.tk,{q:'',status:'abertas',pri:'',cat:'',proj:''});render();};
function kanbanTasks(list){
  return `<div class="kb" id="kbScroll" data-keep-scroll style="--cols:5">${Object.entries(TST).map(([k,l])=>{
    let L=sortTasks(list.filter(t=>t.status===k));const more=k==='concluida'&&L.length>25?L.length-25:0;if(more)L=L.slice(0,25);
    return `<div class="kb-col" data-drop="tstatus:${k}"><div class="kb-h"><span class="st-dot st-${k}"></span>${l}<em>${list.filter(t=>t.status===k).length}</em></div>
      <div class="kb-list">${L.map(kbCard).join('')||'<div class="kb-empty">Arraste tarefas para cá</div>'}${more?`<button class="link" data-a="tkView" data-v="historico">+${more} no histórico</button>`:''}</div>
      ${k!=='concluida'&&k!=='cancelada'?`<button class="kb-add" data-a="newTask" data-status="${k}">${ic('plus',14)}Adicionar</button>`:''}</div>`;
  }).join('')}</div><p class="hint" style="margin-top:8px">Arraste os cartões entre as colunas para mudar o status (no tablet, toque e segure).</p>`;
}
function kbCard(t){
  const p=projOf(t.projectId);const st=subProg(t);
  return `<div class="kb-card ${isLate(t)?'late':''}" data-drag="task:${t.id}" data-a="openRef" data-type="task" data-id="${t.id}" style="--c:${catOf(t.categoryId).color}">
    <div class="kb-top">${priPill(t.priority)}${t.categoryId?catChip(t.categoryId,t.categoryOther):''}</div><b>${esc(t.title)}</b>
    <div class="meta">${t.due?`<span class="${isLate(t)?'late-t':''}">${ic('clock',12)}${relDay(t.due)}${t.dueTime?' '+t.dueTime:''}</span>`:''}${st?`<span>${ic('tasks',12)}${st}</span>`:''}${p?`<span>${ic('briefcase',12)}${esc(p.name)}</span>`:''}</div></div>`;
}
function taskCalendar(list){
  const d=U.tk.month||today();const m=ym(d);const td=today();const cells=monthCells(d);
  const by={};list.filter(t=>t.due).forEach(t=>(by[t.due]||(by[t.due]=[])).push(t));
